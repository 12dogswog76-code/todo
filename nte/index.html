<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Политика безопасности содержимого. Внешних скриптов на странице нет —
     весь код лежит здесь же, поэтому чужие подключить нельзя вообще.
     object-src и base-uri закрыты наглухо: это классические лазейки. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.alextask.ru https://alextask-push.12dogswog76.workers.dev; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<title>NTE — справочник</title>
<!-- Своя иконка вкладки. Раньше подтягивалась ../icon.svg от списка задач,
     и в браузере справочник было не отличить от него. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon-nte.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-nte.png">
<link rel="apple-touch-icon" href="icon-nte.png">
<style>
  /* ── Токены ───────────────────────────────────────────────────────────────
     Основа снята с ntebuild.com: четыре ступени фона и границы только белым с
     альфой. Своих серых больше нет — от этого интерфейс перестаёт «рябить».
     Акцент оставлен свой, зелёный: он общий с ZZZ-трекером и служит опознавательным
     знаком сайта. */
  :root{
    color-scheme: dark;
    --bg:#121212;        /* фон страницы */
    --pan:#1c1c1c;       /* карточки и строки */
    --pan2:#222222;      /* поднятые блоки, подложка под hover */
    --panel:#17171a;     /* шапка, полосы навигации */
    --line:hsla(0,0%,100%,.10);
    --line-soft:hsla(0,0%,100%,.05);
    --line-hard:hsla(0,0%,100%,.20);
    --tx:#f0f0f8; --tx2:#8a8aa0; --tx3:#4a4a60;
    --acc:#4ade80; --ok:#4ade80; --warn:#ffb800; --info:#00b4e5; --gold:#ffb800;
    --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,"Roboto Mono",monospace;
    /* Заголовочный шрифт узкий и с русскими буквами: Bebas, с которого снята
       чужая система, кириллицы не знает вовсе. */
    --disp:Oswald,"Arial Narrow",Impact,sans-serif;
    --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
    /* Свечение вместо теней: у карточки со статусом подсветка своим цветом,
       а не чёрная тень под ней. */
    --glass:inset 0 0 40px hsla(0,0%,100%,.02);
    /* Стихии — палитра из игры. Цвет тянется в рамку карточки, бейдж и подпись. */
    --Anima:#00e5a0; --Chaos:#7b5ea7; --Cosmos:#8fb8d0;
    --Incantation:#e75395; --Lakshana:#ffb800; --Psyche:#00b4e5;
    /* Тиры: горячий — мета, холодный — аутсайдер. */
    --t-sp:#ff3d3d; --t-s:#ff7a00; --t-a:#ffd600;
    --t-b:#b8d600; --t-c:#7fd600; --t-d:#4aadff;
  }
  /* Шрифты лежат рядом с сайтом: подключать их со стороннего домена нельзя —
     политика безопасности страницы запрещает внешние источники, да и грузятся
     локальные быстрее. Если файлов ещё нет, подхватится системный запасной. */
  @font-face{font-family:Oswald;src:url(fonts/oswald-latin.woff2) format("woff2");
    font-weight:600;font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:Oswald;src:url(fonts/oswald-cyr.woff2) format("woff2");
    font-weight:600;font-display:swap;
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:Inter;src:url(fonts/inter-latin.woff2) format("woff2");
    font-weight:100 900;font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:Inter;src:url(fonts/inter-cyr.woff2) format("woff2");
    font-weight:100 900;font-display:swap;
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:hsla(140,70%,60%,.35);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:hsla(140,70%,60%,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:var(--body);font-size:14px}
  /* Крупные экраны: вёрстка сделана под ~1400px, на FHD и 2K всё мелкое.
     zoom, а не transform: scale — последний ломает position:sticky и fixed,
     а нам нужен и липкий арт в карточке, и шапка. */
  @media (min-width:1900px){ body{zoom:1.25} }
  @media (min-width:2500px){ body{zoom:1.5} }
  body{padding:0 0 60px}
  a{color:var(--info)}
  .wrap{max-width:1560px;margin:0 auto;padding:0 18px}

  /* ── шапка и вкладки ── */
  .top{position:sticky;top:0;z-index:20;background:#17171aee;backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);padding:11px 0;margin-bottom:16px}
  .top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top-in .srch{margin-left:auto}
  .logo{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:1.2px;
    display:flex;align-items:center;gap:9px;line-height:1}
  .logo b{color:var(--acc)}
  .logo i{font-family:var(--body);font-style:normal;font-size:9px;font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;color:var(--tx2);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-radius:14px;
    background:#00000066;border:1px solid var(--line-soft)}
  .tb{background:transparent;border:1px solid transparent;color:hsla(0,0%,100%,.35);
    cursor:pointer;border-radius:9px;padding:7px 14px;font-size:10.5px;font-weight:800;
    letter-spacing:.18em;text-transform:uppercase;font-family:var(--body);transition:.2s}
  .tb:hover{color:hsla(0,0%,100%,.75);background:hsla(0,0%,100%,.04)}
  .tb.on{color:var(--acc);background:hsla(140,70%,60%,.15);border-color:hsla(140,70%,60%,.35)}
  .top-sp{flex:1}
  .srch{background:#00000066;border:1px solid var(--line-soft);border-radius:12px;color:var(--tx);
    padding:9px 14px;font-size:12px;font-family:var(--body);min-width:180px;
    letter-spacing:.05em}
  .srch::placeholder{color:hsla(0,0%,100%,.25);text-transform:uppercase;
    font-size:10px;font-weight:800;letter-spacing:.2em}
  .srch:focus{outline:none;border-color:hsla(140,70%,60%,.4);background:#0000008c}

  /* ── фильтры ── */
  .fbar{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;align-items:center}
  .fgrp{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .fgrp>u{font-style:normal;text-decoration:none;font-size:9px;color:hsla(0,0%,100%,.25);
    text-transform:uppercase;letter-spacing:.3em;font-weight:800;margin-right:4px}
  .fb{background:var(--pan);border:1px solid var(--line-soft);color:var(--tx2);cursor:pointer;
    border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;
    font-family:var(--body);transition:.2s;display:flex;align-items:center;gap:7px}
  .fb:hover{border-color:var(--line-hard);color:var(--tx);transform:translateY(-1px)}
  .fb.on{border-color:hsla(140,70%,60%,.45);color:var(--tx);
    background:linear-gradient(135deg,hsla(140,70%,60%,.12),rgba(10,10,10,.8));
    box-shadow:0 0 20px hsla(140,70%,60%,.14)}
  .fb img{width:16px;height:16px;object-fit:contain}
  .fcnt{font-size:9px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
    color:hsla(0,0%,100%,.25);margin-left:auto}

  /* ── режим карты ──
     Карте нужна площадь. В обычном режиме страница упирается в 1560 пикселей
     и на широком мониторе по бокам пустует половина экрана; шапка со строкой
     фильтров съедают ещё полторы сотни по высоте. На вкладке карты снимаем
     и то и другое: ширина по окну, шапка тоньше, счётчик точек уезжает в
     угол карты. Остальные вкладки этого не замечают. */
  body.mapmode .wrap{max-width:none;padding:0 12px}
  body.mapmode .top{padding:5px 0;margin-bottom:9px}
  body.mapmode .top-in{gap:10px}
  body.mapmode .logo{font-size:19px}
  body.mapmode .tb{padding:5px 11px}
  body.mapmode .srch{padding:6px 12px}
  body.mapmode #filters{display:none}
  body.mapmode #foot{margin-top:8px}
  .mapcnt i{font-style:normal;color:hsla(0,0%,100%,.3)}

  /* ── «что горит» на главной ──
     Узкие плашки со сроками: баннеры, события, неактивированные коды. */
  .tds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:7px;margin-bottom:14px}
  .td{padding:9px 12px;border-radius:12px;background:var(--pan);
    border:1px solid var(--line-soft);cursor:pointer;transition:.15s}
  .td:hover{border-color:var(--line-hard);transform:translateY(-1px)}
  .td b{display:block;font-size:13px;color:var(--tx);line-height:1.25}
  .td i{display:block;margin-top:3px;font-style:normal;font-size:10.5px;
    color:var(--tx3)}
  /* горит сильнее: три дня и меньше */
  .td.hot{border-color:hsla(41,100%,50%,.45);
    background:linear-gradient(135deg,hsla(41,100%,50%,.10),var(--pan))}
  .td.hot i{color:var(--gold)}

  /* ── что изменилось с прошлого прогона сборщика ── */
  .chgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:5px}
  .chg{font-size:11.5px;line-height:1.45;color:var(--tx2);padding:5px 9px;
    border-radius:9px;background:var(--pan2);border:1px solid var(--line-soft);
    border-left-width:3px}
  .chg.add{border-left-color:var(--acc);color:var(--tx)}
  .chg.gone{border-left-color:hsla(0,70%,60%,.6)}

  /* ── вкладка «События» ── */
  .evcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:9px}
  .evc{padding:12px 14px;border-radius:15px;background:var(--pan);
    border:1px solid var(--line-soft)}
  .evc.on{border-color:hsla(140,70%,60%,.35);
    background:linear-gradient(135deg,hsla(140,70%,60%,.08),var(--pan))}
  .evc.soon{border-color:hsla(200,80%,60%,.3)}
  .evc.perm{opacity:.85}
  .evc.hot{border-color:hsla(41,100%,50%,.5);
    background:linear-gradient(135deg,hsla(41,100%,50%,.10),var(--pan))}
  .evc-h{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
  .evc-h b{font-size:14px;color:var(--tx);flex:1;min-width:140px;line-height:1.3}
  .evc-h u{font-style:normal;text-decoration:none;font-size:8.5px;font-weight:900;
    letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;flex:none}
  .evc-d{margin-top:7px;font-size:11.5px;color:var(--tx2)}
  .evc.hot .evc-d{color:var(--gold)}
  .evc-en{font-size:10px;color:var(--tx3);margin-top:2px}
  .evc-r{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

  /* ── сравнение двух эсперов ── */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .cmp-h{display:flex;align-items:center;gap:10px;background:var(--pan);
    border:1px solid var(--line-soft);border-radius:14px;padding:10px 12px}
  .cmp-h img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;
    background:#0d0f14;border:1px solid var(--line)}
  .cmp-h select{flex:1;min-width:0;background:#00000066;border:1px solid var(--line-soft);
    border-radius:10px;color:var(--tx);padding:8px 10px;font-family:var(--body);
    font-size:13px}
  .cmp-h select:focus{outline:none;border-color:hsla(140,70%,60%,.4)}
  .cmp-t{display:grid;gap:4px;margin-bottom:12px}
  .cmp-r{display:grid;grid-template-columns:200px 1fr 1fr;gap:8px;align-items:center;
    padding:7px 12px;border-radius:10px;background:var(--pan);
    border:1px solid var(--line-soft)}
  .cmp-r u{font-style:normal;text-decoration:none;font-size:10px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
  .cmp-r b{font-size:13px;color:var(--tx2);font-weight:600}
  .cmp-r b.win{color:var(--acc);font-weight:800}
  .cmp2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cmp2 ul{margin:0;padding-left:17px;font-size:12px;line-height:1.6;color:var(--tx2)}
  @media (max-width:760px){
    .cmp,.cmp2{grid-template-columns:1fr}
    .cmp-r{grid-template-columns:1fr;gap:2px}
  }

  /* ── планировщик: строка эспера ──
     Портрет, имя, «1 → 80» и число прорывов в одну линию. Раньше это были
     блоки-таблетки в три ряда на каждого, и двадцать эсперов занимали
     полтора экрана. */
  .plrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
  .plrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:11px;
    background:var(--pan);border:1px solid var(--line-soft);cursor:pointer;transition:.15s}
  .plrow:hover{border-color:var(--line-hard)}
  .plrow img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;
    background:#0d0f14}
  .plrow b{font-size:13px;color:var(--tx);flex:1;min-width:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .plrow u,.plrow em{font-style:normal;text-decoration:none;font-family:var(--mono),monospace;
    font-size:11.5px;color:var(--tx2);flex:none}
  .plrow u i,.plrow em i{font-style:normal;color:var(--tx3);margin:0 3px;font-size:10px}
  .plrow em{color:var(--gold)}

  /* ── аномальная мебель ──
     Общее правило раскладки: блоки одной высоты, в несколько колонок,
     выровнены друг по другу; то, что раскрывается, раскрывается в ширину, а
     не вниз — на экран иначе не помещается. */
  .anoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:9px;align-items:start}
  .anom{background:var(--pan);border:1px solid var(--line-soft);border-radius:14px;
    padding:11px 13px;overflow:hidden}
  details.anom>summary{list-style:none;cursor:pointer;display:block}
  details.anom>summary::-webkit-details-marker{display:none}
  details.anom[open]{grid-column:1/-1;border-color:var(--line)}
  .anom-h{display:flex;gap:10px;align-items:flex-start}
  .anom-h img{width:46px;height:46px;flex:none;object-fit:contain;border-radius:10px;
    background:#0d0f14;border:1px solid var(--line);padding:3px}
  .anom-h b{display:block;font-size:13px;color:var(--gold);line-height:1.3}
  .anom-h span{display:block;margin-top:4px;font-size:11.5px;line-height:1.55;
    color:var(--tx2)}
  details.anom>summary em{display:inline-block;margin-top:9px;font-style:normal;
    font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  details.anom[open]>summary em{border-color:var(--acc);color:var(--acc)}
  .anom-lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:6px;margin-top:10px}
  .anom-s{display:flex;gap:8px;align-items:flex-start;background:var(--pan2);
    border:1px solid var(--line-soft);border-radius:10px;padding:7px 9px}
  .anom-s u{font-style:normal;text-decoration:none;font-family:var(--mono),monospace;
    font-size:10px;color:var(--tx3);flex:none;min-width:14px}
  .anom-s span{font-size:11.5px;line-height:1.55;color:var(--tx2)}

  /* «Зачем он в команде»: роль строкой, под ней два-три пункта из пассивок */
  .why{background:linear-gradient(135deg,hsla(140,70%,60%,.07),var(--pan));
    border:1px solid hsla(140,70%,60%,.25);border-radius:14px;padding:12px 14px;
    margin-bottom:10px}
  .why b{display:block;font-family:var(--disp);font-size:15px;color:var(--acc);
    margin-bottom:7px}
  .why ul{margin:0;padding-left:17px;color:var(--tx2);font-size:12.5px;line-height:1.65}
  .why li{margin:2px 0}
  .why i{display:block;margin-top:8px;font-style:normal;font-size:9px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
  .mapcnt{position:absolute;left:12px;top:10px;z-index:6;pointer-events:none;
    background:rgba(10,12,16,.78);border:1px solid var(--line);border-radius:9px;
    padding:5px 10px;font-size:9px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:hsla(0,0%,100%,.45)}

  /* ── сетка эсперов ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
  /* Карточка красится цветом стихии: диагональный градиент от её цвета к
     почти чёрному плюс рамка того же цвета. Цвет здесь — не украшение, а
     признак: по нему стихия читается раньше, чем значок. */
  .card{background:linear-gradient(135deg,color-mix(in srgb,var(--el,#888) 8%,transparent),
      rgba(10,10,10,.8));border:1px solid color-mix(in srgb,var(--el,#888) 22%,transparent);
    border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
  .card:hover{transform:translateY(-2px);
    border-color:color-mix(in srgb,var(--el,#888) 50%,transparent);
    box-shadow:0 0 28px color-mix(in srgb,var(--el,#888) 15%,transparent),
      inset 0 0 40px color-mix(in srgb,var(--el,#888) 4%,transparent)}
  .card-p{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0d0f14}
  .card-p img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .card-p:after{content:'';position:absolute;inset:auto 0 0 0;height:55%;
    background:linear-gradient(180deg,#0b0d1100,#111318f2)}
  .card-t{position:absolute;top:7px;left:7px;z-index:2;font-family:var(--disp);
    font-size:13px;font-weight:600;letter-spacing:.04em;line-height:1;
    border-radius:7px;padding:3px 7px;background:#000000c4;color:var(--tier,var(--gold))}
  .card-e{position:absolute;top:7px;right:7px;z-index:2;display:flex;gap:3px}
  .card-e img{width:19px;height:19px;background:#000000b8;border-radius:50%;padding:2px}
  .card-n{position:absolute;left:9px;right:9px;bottom:7px;z-index:2}
  .card-n b{display:block;font-family:var(--disp);font-size:17px;font-weight:700;
    letter-spacing:.03em;line-height:1.05;text-shadow:0 2px 6px #000,0 0 3px #000}
  .card-n i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:hsla(0,0%,100%,.35)}

  /* ── карточка эспера ── */
  .sheet{position:fixed;inset:0;z-index:40;background:#05060988;backdrop-filter:blur(4px);
    display:none;padding:18px 14px}
  .sheet.on{display:flex}
  /* Карточка — две колонки: слева неподвижный арт с именем и вкладками,
     справа прокручивается только содержимое. Липкий арт, который «едет» за
     экраном, на длинных сборках показывал персонажу одни ноги. */
  .sheet-in{max-width:1180px;width:100%;margin:auto;background:var(--pan);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px #000000b0;
    max-height:100%;overflow:hidden;display:flex;align-items:stretch}
  .sh-head{display:flex;gap:0;flex:1 1 auto;min-height:0;min-width:0}
  /* Арт — крупный и чистый: подписи на нём не рисуем. Раньше имя со значком
     стихии лежало поверх картинки и на светлых артах читалось плохо.
     Едет за экраном при прокрутке — ровно как .hart в трекере ZZZ: sticky с
     ограничением по высоте окна. Без него картинка оставалась в начале
     карточки, и дальше сборку читаешь уже без неё. */
  .sh-art{flex:0 0 380px;position:relative;align-self:stretch;overflow:hidden;
    max-height:100%;
    border-radius:18px 0 0 18px;
    /* Подложка под артом красится стихией: на голом чёрном фоне персонаж
       выглядел вырезанным и приклеенным на пустое поле. */
    background:radial-gradient(120% 80% at 50% 0%,
      color-mix(in srgb,var(--el,#666) 26%,transparent) 0%,
      color-mix(in srgb,var(--el,#666) 8%,transparent) 45%, #0d0f14 100%)}
  .sh-art img{width:100%;height:100%;object-fit:cover;object-position:center 6%;
    position:absolute;inset:0}
  .sh-art:after{content:'';position:absolute;inset:auto 0 0 0;height:26%;
    background:linear-gradient(180deg,#0d0f1400,#0d0f14e6)}
  /* имя, латиница и «тир · стихия · роль» — в теле карточки, а не на арте.
     Шапка лежит на подложке в цвет стихии и тянется во всю ширину тела:
     до этого она висела на голом фоне и карточка начиналась ничем. */
  .sh-title{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
    margin:-18px -20px 12px;padding:18px 20px 14px;
    background:linear-gradient(180deg,
      color-mix(in srgb,var(--el,#666) 22%,transparent) 0%,
      color-mix(in srgb,var(--el,#666) 6%,transparent) 60%, transparent 100%);
    border-bottom:1px solid color-mix(in srgb,var(--el,#666) 22%,var(--line))}
  .sh-title h2{margin:0;font-family:var(--disp);font-size:32px;font-weight:600;
    letter-spacing:.01em;line-height:.95;text-transform:uppercase}
  .sh-title h2 i{display:block;font-family:var(--body);font-style:normal;font-size:9px;
    font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    color:var(--el-c,var(--tx2));margin-top:5px}
  .sh-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
  /* самое нужное сразу под именем: лучшее оружие, набор и главная
     характеристика. Раньше за этим приходилось лезть во вкладку «Гайд». */
  .sh-facts{display:flex;gap:7px;flex-wrap:wrap;width:100%;margin:12px 0 0}
  .fact{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;
    border-radius:11px;background:#00000055;border:1px solid var(--line-soft);
    font-size:11.5px;color:var(--tx2);max-width:100%}
  .fact img{width:26px;height:26px;object-fit:contain;flex:none}
  .fact i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--tx3);display:block}
  .fact b{color:var(--tx);font-weight:700;display:block;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:800;
    letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
    background:var(--pan);border:1px solid var(--line-soft);color:var(--tx)}
  .tag img{width:14px;height:14px}
  .tag.tier{font-family:var(--disp);font-size:15px;letter-spacing:.04em;padding:3px 12px;
    color:var(--tier,var(--gold));border-color:color-mix(in srgb,var(--tier,#ffb800) 45%,transparent);
    background:color-mix(in srgb,var(--tier,#ffb800) 12%,transparent)}
  /* вкладки внутри карточки — те же, что в трекере ZZZ */
  .htabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;padding:4px;
    border-radius:14px;background:#00000066;border:1px solid var(--line-soft)}
  .htab{background:transparent;border:1px solid transparent;color:hsla(0,0%,100%,.3);
    cursor:pointer;border-radius:9px;padding:8px 16px;font-size:10px;font-weight:900;
    letter-spacing:.2em;text-transform:uppercase;font-family:var(--body);transition:.2s}
  .htab:hover{color:hsla(0,0%,100%,.7);background:hsla(0,0%,100%,.04)}
  .htab.on{color:var(--acc);background:hsla(140,70%,60%,.15);border-color:hsla(140,70%,60%,.35)}
  /* Точечная фактура — тот же приём, что в трекере ZZZ у .hbody: сетка
     полупрозрачных точек шагом 4 пикселя. Панель перестаёт выглядеть
     плоской заливкой, при этом текст поверх читается как читался. */
  .sh-body{flex:1;min-width:320px;padding:18px 20px 22px;overflow-y:auto;min-height:0;
    background-image:radial-gradient(#ffffff0a 1px,transparent 1.2px);
    background-size:4px 4px}
  /* Ссылка на prydwen и «закрыть»: обе были блёклой серой рамкой и терялись
     в углу. Теперь ссылка подсвечена акцентом, крестик краснеет при наведении. */
  .sh-title a.x{border-color:hsla(140,70%,60%,.35);color:var(--acc);
    background:hsla(140,70%,60%,.08);font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;gap:5px}
  .sh-title a.x:hover{background:hsla(140,70%,60%,.18);border-color:var(--acc);
    box-shadow:0 0 18px hsla(140,70%,60%,.22)}
  .sh-title button.x{font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;padding:6px 12px;background:#00000055;
    border-color:var(--line);color:var(--tx2)}
  .sh-title button.x:hover{background:hsla(0,85%,65%,.12);border-color:#f87171;
    color:#f87171;box-shadow:0 0 18px hsla(0,85%,65%,.18)}
  .sh-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--pan2);border:1px solid var(--line);
    border-radius:10px;padding:5px 11px;font-size:12px;color:var(--tx2)}
  .chip img{width:17px;height:17px}
  .chip b{color:var(--tx);font-weight:700}
  .chip.tier b{color:var(--gold);font-size:14px}
  .x{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--tx3);
    cursor:pointer;border-radius:9px;padding:5px 11px;font-size:13px;font-family:inherit}
  .x:hover{border-color:#f87171;color:#f87171}
  a.x{color:var(--tx3);display:inline-flex;align-items:center}
  a.x:hover{border-color:var(--acc);color:var(--acc)}

  /* Заголовок раздела: цветная палочка слева и линия, уходящая в прозрачность.
     Самый узнаваемый элемент чужой системы — и самый дешёвый в переносе. */
  .cap{display:flex;align-items:center;gap:11px;margin:22px 0 11px}
  .cap:first-child{margin-top:0}
  .cap:before{content:'';width:3px;height:19px;border-radius:999px;
    background:var(--capc,var(--acc));flex:none}
  .cap b{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:#fff;line-height:1}
  .cap span{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .cap em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:hsla(0,0%,100%,.28)}

  .rows{display:flex;flex-direction:column;gap:5px}
  /* Строка рейтинга — ядро списков: слева номер, справа процент от лучшего.
     Первая строка подсвечена золотом, как «лучший вариант». */
  .row{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:14px;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));
    border:1px solid var(--line-soft);font-size:12.5px;transition:.2s}
  .row:hover{border-color:var(--line);transform:translateY(-1px)}
  .row u{font-style:normal;text-decoration:none;flex:0 0 18px;text-align:center;
    font-family:var(--disp);font-size:15px;color:hsla(0,0%,100%,.3);font-weight:700}
  .row b{flex:1;font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.02em;
    color:var(--tx)}
  .row .m{font-size:8px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
    color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
  .row .pct{font-family:var(--disp);font-size:18px;color:var(--gold);font-weight:400;
    line-height:1}
  .row.best{border-color:hsla(41,100%,50%,.5);
    background:linear-gradient(135deg,hsla(41,100%,50%,.10),rgba(10,10,10,.8));
    box-shadow:0 0 28px hsla(41,100%,50%,.15),inset 0 0 40px hsla(41,100%,50%,.04)}
  /* Ранг вещи цветом, как в игре: S — золото, A — фиолет, B — синий.
     Раньше S красился в var(--Incantation) — это цвет стихии «Заклинание»,
     розово-фиолетовый, и легендарное оружие было не отличить от эпического. */
  .row .r-S{color:var(--gold)} .row .r-A{color:#a78bfa} .row .r-B{color:#60a5fa}
  /* строка списка раскрывается: внутри — описание вещи и её цифры */
  .pick{margin:0}
  .pick>summary{list-style:none;cursor:pointer}
  .pick>summary::-webkit-details-marker{display:none}
  .pick>summary:after{content:'';width:6px;height:6px;flex:none;margin-left:2px;
    border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);
    transform:rotate(45deg);transition:.2s}
  .pick[open]>summary:after{transform:rotate(-135deg)}
  .pick[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .pick-in{padding:10px 13px 12px;margin:-4px 0 0;border-radius:0 0 14px 14px;
    background:var(--pan2);border:1px solid var(--line-soft);border-top:0}
  .pick-bt{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  /* картинка вещи в строке: по названию оружие и набор не опознать */
  .row>img{width:34px;height:34px;flex:none;border-radius:9px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line);padding:2px}

  .prio{font-size:12.5px;line-height:1.7;color:var(--tx2);background:var(--pan2);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px}
  .prio b{color:var(--tx)}
  .prio .gt{color:var(--tx3);margin:0 3px}

  .goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .goal{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;
    background:var(--pan2);border:1px solid var(--line);font-size:12px}
  .goal span{flex:1;color:var(--tx2)}
  .goal b{color:var(--gold);font-family:var(--mono);font-weight:700}
  .goal.note{cursor:help}
  .goal u{font-style:normal;text-decoration:none;display:inline-flex;align-items:center;
    justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--tx3);
    color:var(--tx3);font-size:9px;font-weight:700;flex:none}

  .set{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .set-n{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.02em;
    color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:10px}
  .set-n img{width:38px;height:38px;object-fit:contain;border-radius:9px;
    background:#0d0f14;border:1px solid var(--line);padding:2px}
  .set-b{font-size:12px;line-height:1.55;color:var(--tx2);padding:4px 0}
  .set-b i{font-style:normal;color:var(--acc);font-weight:700;margin-right:6px}
  .pieces{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .pc{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--tx2);
    border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:var(--pan)}
  .trait{font-size:12px;line-height:1.55;color:var(--tx2);margin-top:9px;
    border-top:1px solid var(--line);padding-top:9px}
  .trait i{font-style:normal;color:var(--tx3);display:block;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}

  /* ── списки оружия и картриджей ── */
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:9px}
  .item{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--pan2);
    border:1px solid var(--line);box-shadow:var(--glass)}
  .item-ic{width:56px;height:56px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line)}
  .item-b{min-width:0;flex:1}
  .item-b b{display:block;font-size:13px;line-height:1.25;margin-bottom:2px}
  .item-b i{font-style:normal;font-size:11px;color:var(--tx3);line-height:1.5;display:block}
  .rar{font-size:8px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
    border-radius:999px;padding:2px 8px;margin-right:7px;border:1px solid var(--line);
    vertical-align:2px}
  .rar.S{color:var(--Incantation);border-color:hsla(332,74%,62%,.5);background:hsla(332,74%,62%,.12)}
  .rar.A{color:var(--Chaos);border-color:hsla(266,29%,51%,.5);background:hsla(266,29%,51%,.12)}
  .rar.B{color:var(--Cosmos);border-color:hsla(203,38%,69%,.5);background:hsla(203,38%,69%,.12)}

  /* ── тир-лист ── */
  .tier-row{display:flex;gap:12px;margin-bottom:9px;background:var(--pan2);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;align-items:flex-start;box-shadow:var(--glass)}
  .tier-l{flex:0 0 58px;font-size:22px;font-weight:800;text-align:center;color:var(--gold);
    padding-top:14px}
  .tier-l.t0{color:#fca5a5} .tier-l.t3{color:var(--tx3)}
  .tier-g{flex:1;display:flex;flex-wrap:wrap;gap:7px}
  .tier-a{width:74px;cursor:pointer;text-align:center;transition:.12s}
  .tier-a:hover{transform:translateY(-2px)}
  .tier-a img{width:64px;height:64px;border-radius:12px;object-fit:cover;
    border:1px solid var(--line);background:#0d0f14}
  .tier-a span{display:block;font-size:10px;color:var(--tx3);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── баннеры ── */
  .bgrp{margin-bottom:18px}
  /* Плашки во всю ширину ряда: с артом на фоне узкая карточка смотрится
     обрезанной, а места на странице всё равно хватает — до правого края
     оставалось полэкрана пустоты. */
  .bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:11px}
  .bc{display:flex;gap:12px;padding:11px 13px;border-radius:16px;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));
    border:1px solid var(--line-soft);align-items:center;cursor:default;transition:.2s}
  .bc:hover{transform:translateY(-1px);border-color:var(--line)}
  /* Плашка с артом: картинка уходит фоном вправо и растворяется к левому
     краю, чтобы текст поверх читался. Высота фиксированная — иначе соседние
     карточки в ряду получаются разной высоты и ряд «пляшет». */
  /* Арт не фоном, а полноценной картинкой справа: во всю высоту плашки, с
     головой на месте и без размытия. Фоном он смотрелся обрезанным куском
     непонятно чего — арты вертикальные, в полосу 130 пикселей попадал живот.
     Слева от картинки — мягкая растушёвка в цвет плашки, чтобы стык не резал
     глаз. */
  .bc.bc-art{position:relative;overflow:hidden;min-height:150px;padding-right:0}
  /* Арт занимает правую половину плашки и выходит за её верх и низ: при
     background-size:contain он вписывался целиком и висел маленькой фигуркой
     посреди пустоты. cover с привязкой к верху показывает персонажа крупно,
     обрезая низ — там всё равно ноги. */
  .bc-art-i{position:absolute;right:0;top:-14%;bottom:-14%;width:52%;z-index:0;
    pointer-events:none;
    background-image:var(--bg);background-size:auto 128%;background-repeat:no-repeat;
    background-position:right 6% top;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 40%,#000 100%)}
  .bc.bc-art>img,.bc.bc-art>.bc-b{position:relative;z-index:1}
  .bc.bc-art>.bc-b{max-width:60%}
  /* плашки без арта не должны быть заметно ниже соседних в ряду */
  .bc{min-height:104px}
  /* Заливка цветом стихии. У плашки эспера — его собственной, у оружия —
     того эспера, с которым оно выходит: пары видно по порядку в расписании. */
  .bc.bc-el{background:linear-gradient(115deg,
    color-mix(in srgb, var(--el) 22%, rgba(10,10,12,.92)) 0,
    rgba(10,10,12,.92) 62%);
    border-color:color-mix(in srgb, var(--el) 38%, var(--line-soft))}
  .bc.bc-el.live{box-shadow:0 0 28px color-mix(in srgb, var(--el) 22%, transparent),
    inset 0 0 40px color-mix(in srgb, var(--el) 8%, transparent)}
  .bc.bc-el .bc-k{border-color:color-mix(in srgb, var(--el) 45%, var(--line))}
  .bc.live{border-color:hsla(140,70%,60%,.5);
    background:linear-gradient(135deg,hsla(140,70%,60%,.10),rgba(10,10,10,.8));
    box-shadow:0 0 28px hsla(140,70%,60%,.15),inset 0 0 40px hsla(140,70%,60%,.04)}
  /* Класс назывался «top» — ровно как у шапки сайта, и карточка получала её
     position:sticky с z-index:20: главные баннеры прилипали к верху экрана и
     наезжали на меню. Имя должно быть своим. */
  .bc.bc-main{border-color:#ffd54a3d}
  .bc img{width:52px;height:52px;border-radius:11px;object-fit:cover;flex:none;
    background:#0d0f14;border:1px solid var(--line)}
  .bc-b{min-width:0;flex:1}
  .bc-b b{display:block;font-family:var(--disp);font-size:16px;font-weight:700;line-height:1.15}
  .bc-b i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:hsla(0,0%,100%,.3);display:block;line-height:1.8}
  .bc-k{font-size:7.5px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;
    color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;
    margin-right:6px;vertical-align:1px}
  .bc-k.arc{color:#c4b5fd;border-color:#a78bfa40}
  /* дата — то, ради чего сюда и заходят: когда кончится и сколько осталось */
  .bc-b i.bc-d{color:var(--gold);font-weight:700;font-size:11.5px;margin-top:2px}
  .bc-b i.bc-d.off{color:var(--tx3);font-weight:400}
  .bc.live .bc-b i.bc-d{color:var(--acc)}
  .bc{cursor:pointer}
  /* отсчёт: моноширинные цифры, иначе строка дёргается каждую секунду */
  .bc-b i.bc-t{display:block;margin-top:3px;font-size:11px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--tx2)}
  .bc-b i.bc-t.soon{color:#6fc0ff}
  .bc-b i.bc-t.done{color:var(--tx3);font-weight:400}
  .bc.live .bc-b i.bc-t{color:var(--acc)}

  /* ── планировщик Console ── */
  .plan{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .plan-l{flex:0 0 auto}
  .plan-r{flex:1;min-width:280px}
  .board{display:grid;gap:3px;background:var(--pan2);border:1px solid var(--line);
    border-radius:14px;padding:10px;box-shadow:var(--glass)}
  .cell{width:42px;height:42px;border-radius:8px;background:#0d0f14;border:1px solid var(--line);
    cursor:pointer;transition:.1s;position:relative}
  .cell.off{background:transparent;border-color:transparent;cursor:default}
  .cell.on{border-color:transparent}
  .cell.hint{outline:2px solid var(--acc);outline-offset:-2px}
  .cell.bad{outline:2px solid #f87171;outline-offset:-2px}
  .cell b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-family:var(--mono);color:#0b0d11;font-weight:800}
  .pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pi{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;
    cursor:pointer;font-size:11.5px;color:var(--tx2);font-family:inherit;transition:.12s;
    display:flex;align-items:center;gap:7px}
  .pi:hover{border-color:var(--tx3);color:var(--tx)}
  .pi.on{border-color:var(--acc);color:var(--tx);background:linear-gradient(180deg,#4ade8022,#4ade800a)}
  .pi .shp{display:grid;gap:1px}
  .pi .shp i{width:6px;height:6px;background:var(--tx3);border-radius:1px}
  .pi.on .shp i{background:var(--acc)}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .st{background:var(--pan);border:1px solid var(--line-soft);border-radius:14px;
    padding:10px 14px;font-size:8.5px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:hsla(0,0%,100%,.28)}
  .st b{display:block;font-family:var(--disp);font-size:26px;font-weight:400;color:var(--tx);
    letter-spacing:.01em;line-height:1;margin-bottom:4px}
  .st.ok b{color:var(--acc)}

  /* ── команды ── */
  .team{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pan2);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px;
    box-shadow:var(--glass)}
  .team-l{flex:0 0 46px;font-size:17px;font-weight:800;text-align:center;color:var(--gold)}
  .team-l.t0{color:#fca5a5} .team-l.t3{color:var(--tx3)}
  .team-n{flex:0 0 170px;font-size:13px;font-weight:600;line-height:1.3}
  .team-n i{display:block;font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:400}
  .team-s{flex:1;display:flex;gap:7px;flex-wrap:wrap;min-width:240px}
  .slot{display:flex;gap:3px;background:var(--pan);border:1px solid var(--line);
    border-radius:11px;padding:4px}
  .slot .alt{width:56px;text-align:center;cursor:pointer;transition:.12s}
  .slot .alt:hover{transform:translateY(-2px)}
  .slot img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#0d0f14;
    border:1px solid var(--line);display:block;margin:0 auto}
  .slot span{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .syn{background:var(--pan2);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;margin-bottom:7px}
  .syn-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer}
  .syn-h img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#0d0f14}
  .syn-h b{font-size:13px}
  .syn ul{margin:0;padding-left:18px;color:var(--tx2);font-size:12px;line-height:1.6}

  /* ── коды ── */
  .code{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 13px;
    background:linear-gradient(135deg,hsla(140,70%,60%,.05),rgba(10,10,10,.8));
    border:1px solid var(--line-soft);transition:.2s}
  .code:hover{border-color:hsla(140,70%,60%,.3)}
  .code b{font-family:var(--mono);font-size:14px;color:var(--acc);letter-spacing:.06em;
    flex:0 0 auto;user-select:all;font-weight:700}
  .code i{font-style:normal;font-size:11.5px;color:var(--tx2);flex:1;min-width:90px}
  .code em{font-style:normal;font-size:10.5px;color:var(--tx3)}
  .code button{background:var(--pan);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
    border-radius:8px;padding:4px 10px;font-size:11.5px;font-family:inherit}
  .code button:hover{border-color:var(--acc);color:var(--acc)}
  .code button.done{border-color:var(--acc);color:var(--acc)}
  /* введённый код гаснет, но остаётся на виду — чтобы не искать его заново */
  .code.done-c{opacity:.45}
  .code.done-c b{color:var(--tx2);text-decoration:line-through}
  .ck{flex:none;display:flex;align-items:center;cursor:pointer}
  .ck input{position:absolute;opacity:0;width:0;height:0}
  .ck span{width:19px;height:19px;border-radius:6px;border:1px solid var(--line-hard);
    display:block;transition:.15s}
  .ck input:checked + span{background:var(--acc);border-color:var(--acc);
    box-shadow:0 0 12px hsla(140,70%,60%,.4)}
  .ck input:checked + span:after{content:'✓';display:block;text-align:center;
    color:#0d0f14;font-size:13px;font-weight:900;line-height:17px}

  /* ── механики и калькулятор ── */
  .doc{max-width:940px}
  .doc h2{font-size:16px;margin:22px 0 9px;color:var(--tx)}
  .doc h2:first-child{margin-top:0}
  .doc p{font-size:13px;line-height:1.7;color:var(--tx2);margin:0 0 9px}
  .doc ul{font-size:13px;line-height:1.7;color:var(--tx2);margin:0 0 9px;padding-left:20px}
  .doc b{color:var(--tx)}
  .doc code{font-family:var(--mono);font-size:12px;background:var(--pan2);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;color:var(--acc)}
  .box{background:var(--pan2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    margin-bottom:10px;box-shadow:var(--glass)}
  .box>b{display:block;font-size:13.5px;color:var(--gold);margin-bottom:5px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--tx3);font-weight:600;padding:6px 9px;border-bottom:1px solid var(--line)}
  .tbl td{padding:7px 9px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td b{color:var(--tx)}
  .tbl .num{font-family:var(--mono);color:var(--gold);text-align:right;white-space:nowrap}
  .tbl tr.top td{background:linear-gradient(90deg,#4ade800f,transparent)}
  .els{display:flex;gap:4px;align-items:center}
  .els img{width:20px;height:20px}
  .inp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-bottom:12px}
  .inp label{display:block;font-size:11px;color:var(--tx3);margin-bottom:3px}
  .inp input{width:100%;background:var(--pan2);border:1px solid var(--line);border-radius:9px;
    color:var(--tx);padding:7px 11px;font-size:13px;font-family:var(--mono)}
  .inp input:focus{outline:none;border-color:var(--acc)}
  .verdict{border:1px solid #4ade8047;background:linear-gradient(120deg,#4ade800f,var(--pan2));
    border-radius:13px;padding:11px 14px;font-size:13px;line-height:1.6;margin-bottom:12px}
  .verdict b{color:var(--acc)}
  .bar{height:7px;border-radius:6px;background:#0d0f14;border:1px solid var(--line);
    overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24)}

  /* ── оружие: карточка с раскрытием ── */
  .wp{background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));
    border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;transition:.2s}
  .wp:hover{border-color:var(--line)}
  /* Раскрытая карточка занимает всю ширину списка. Раньше она росла в своей
     колонке, а соседние в том же ряду вытягивались следом — рядом с текстом
     висели два пустых прямоугольника. */
  .wp.open{grid-column:1/-1;border-color:hsla(140,70%,60%,.35);
    box-shadow:0 0 28px hsla(140,70%,60%,.10)}
  .wp-h{display:flex;gap:11px;padding:10px 12px;cursor:pointer;align-items:center}
  .wp-h:hover{background:#ffffff06}
  .wp-ic{width:56px;height:56px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line)}
  .wp-b{min-width:0;flex:1}
  .wp-b b{display:block;font-family:var(--disp);font-size:16px;font-weight:700;
    letter-spacing:.02em;line-height:1.15}
  .wp-b i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:hsla(0,0%,100%,.3);display:block;line-height:1.7}
  .wp-own{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;
    border:1px solid #ffd54a55;background:#0d0f14}
  .wp-st{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .wp-st span{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--tx2);border:1px solid var(--line-soft);border-radius:999px;padding:3px 9px;
    background:#00000059}
  .wp-st span b{display:inline;font-family:var(--disp);font-size:13px;color:var(--gold);
    letter-spacing:0;font-weight:400}
  .wp-x{color:var(--tx3);font-size:15px;flex:none;transition:.15s}
  .wp.open .wp-x{transform:rotate(180deg)}
  .wp-d{display:none;padding:0 12px 12px;border-top:1px solid var(--line)}
  .wp.open .wp-d{display:block}
  .lvl{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px;margin-top:9px}
  .lvl div{background:var(--pan);border:1px solid var(--line);border-radius:8px;
    padding:5px 8px;font-size:11px;color:var(--tx3);text-align:center}
  .lvl div b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--tx)}
  .lvl div.max{border-color:#ffd54a4d}
  .lvl div.max b{color:var(--gold)}
  /* ползунки уровня и список материалов */
  .lvpick{position:relative;margin:12px 0 30px}
  .lvpick input{width:100%;accent-color:var(--acc);background:transparent;display:block;
    height:22px;cursor:pointer}
  /* деления под дорожкой — как разметка уровней на ntebuild */
  .ticks{position:relative;height:14px;margin-top:-2px}
  .ticks span{position:absolute;transform:translateX(-50%);font-size:8.5px;font-weight:800;
    letter-spacing:.08em;color:hsla(0,0%,100%,.28);padding-top:5px}
  .ticks span:before{content:'';position:absolute;top:0;left:50%;width:1px;height:4px;
    background:hsla(0,0%,100%,.2)}
  /* Плитка материала: название в две строки и число рядом. Узкие 150 пикселей
     ломали «10 500 000» на три строки. */
  .mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px}
  .mat{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;
    background:var(--pan);border:1px solid var(--line-soft);font-size:11px}
  .mat img{width:32px;height:32px;object-fit:contain;flex:none}
  .mat span{flex:1;color:var(--tx2);line-height:1.3}
  .mat b{font-family:var(--disp);font-size:15px;color:var(--tx);flex:none;
    white-space:nowrap}
  .mat.rS{border-color:hsla(41,100%,50%,.35)} .mat.rA{border-color:hsla(266,29%,51%,.35)}

  /* ── картриджи ── */
  .cart{display:flex;gap:12px;padding:12px 14px;border-radius:16px;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));
    border:1px solid var(--line-soft);align-items:flex-start;transition:.2s}
  .cart:hover{border-color:var(--line);transform:translateY(-1px)}
  .cart-ic{width:54px;height:54px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line);padding:3px}
  .geo{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .geo u{font-style:normal;text-decoration:none;font-size:10px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.5px}
  .gsh{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;
    padding:3px 7px;background:var(--pan);font-size:10.5px;color:var(--tx2)}
  .gsh .mini{display:grid;gap:1px}
  .gsh .mini i{width:5px;height:5px;border-radius:1px;background:var(--tx3)}
  /* ранг детали: те же буквы, что в игре на карточке предмета */
  .rpill{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:7px;
    font-family:var(--disp);font-size:11px;letter-spacing:.06em;vertical-align:2px;
    border:1px solid var(--line);color:var(--tx2);background:var(--pan)}
  .rpill.rS{color:#ffb800;border-color:hsla(41,100%,50%,.45);background:hsla(41,100%,50%,.08)}
  .rpill.rA{color:#b98bff;border-color:hsla(266,60%,65%,.45);background:hsla(266,60%,65%,.08)}
  .rpill.rB{color:#6fc0ff;border-color:hsla(205,80%,60%,.4);background:hsla(205,80%,60%,.08)}
  .mtab{overflow-x:auto;border:1px solid var(--line-soft);border-radius:14px;background:var(--pan)}
  .mtab table{border-collapse:collapse;width:100%;font-size:12px}
  .mtab th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);
    font-weight:700;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
  .mtab th:first-child{text-align:left}
  .mtab td{padding:7px 12px;text-align:right;color:var(--tx2);border-bottom:1px solid var(--line-soft)}
  .mtab td:first-child{text-align:left;color:var(--tx)}
  .mtab tr:last-child td{border-bottom:0}
  .mtab td b{font-family:var(--disp);font-size:14px;color:var(--tx)}
  .mtab td i{font-style:normal;display:block;font-size:10px;color:var(--tx3)}
  /* свежесть данных: зелёный — собрано на днях, жёлтый — пора обновить */
  .fdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
    background:var(--tx3)}
  .fdot.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
  .fdot.warm{background:#ffb800;box-shadow:0 0 7px hsla(41,100%,50%,.6)}
  .fdot.old{background:#ff5a5a;box-shadow:0 0 7px hsla(0,100%,67%,.6)}
  #ver{cursor:pointer}
  /* разделы механик */
  .mfold{border:1px solid var(--line-soft);border-radius:16px;background:var(--pan);
    margin-bottom:10px;overflow:hidden}
  .mfold[open]{border-color:var(--line);background:var(--pan2)}
  .mfold>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;
    align-items:center;gap:10px;user-select:none}
  .mfold>summary::-webkit-details-marker{display:none}
  .mfold>summary:after{content:'';margin-left:auto;width:7px;height:7px;
    border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);
    transform:rotate(45deg);transition:.2s}
  .mfold[open]>summary:after{transform:rotate(-135deg)}
  .mfold>summary b{font-family:var(--disp);font-size:17px;letter-spacing:.02em;color:var(--tx)}
  .mfold-in{padding:0 16px 14px}
  .mfold-in>:first-child{margin-top:0}
  /* город: карточки машин и квартир */
  .car-ic{width:76px;height:52px;object-fit:cover}
  .brand{display:inline-block;margin-left:8px;font-size:10.5px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.08em}
  .flats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .flat{border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));transition:.2s}
  .flat:hover{border-color:var(--line);transform:translateY(-1px)}
  .flat img{width:100%;height:150px;object-fit:cover;display:block;background:#0d0f14}
  .flat-b{padding:12px 14px 14px}
  .flat-b b{font-family:var(--disp);font-size:16px;color:var(--gold)}

  /* кнопка облака в шапке */
  /* Кнопка инструментов — заметная: раньше серый текст на сером терялся. */
  .cloudb{margin-left:10px;padding:7px 14px;border-radius:9px;
    background:hsla(140,70%,60%,.10);border:1px solid hsla(140,70%,60%,.55);
    color:var(--tx);cursor:pointer;font-size:11.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.1em;
    box-shadow:0 0 0 1px hsla(140,70%,60%,.12),0 0 14px hsla(140,70%,60%,.12);transition:.14s}
  .cloudb:hover{background:hsla(140,70%,60%,.18);border-color:var(--acc);color:#fff}
  .cloudb.on{color:var(--acc)}
  /* моя готовность: карточки одного уровня, в несколько колонок */
  .rdyg{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:9px;
    margin-top:10px}
  .rdy{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px;cursor:pointer;
    background:var(--pan);border:1px solid var(--line);border-radius:13px;transition:.15s}
  .rdy:hover{border-color:var(--line-hard);background:var(--pan2)}
  .rdy.pale{opacity:.55}
  .rdy img{width:58px;height:58px;border-radius:11px;object-fit:cover;background:#0d0f14}
  .rdy-t{display:flex;align-items:center;gap:7px}
  .rdy-t b{font-size:13px}
  .rdy-t u{text-decoration:none;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;
    color:var(--tier,var(--tx2));border:1px solid currentColor}
  .rdy-t i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700}
  .rdy-p{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 5px}
  .rdy-p i{display:block;height:100%}
  .rdy-s{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--tx2)}
  .rdy-s span{display:flex;align-items:center;gap:3px}
  .rdy-s b{color:#f87171;font-family:var(--mono);font-weight:600}
  .rdy-s.ok span{color:var(--ok)}
  /* что собирать: коробки одного уровня в несколько колонок */
  .bld{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;
    align-items:start}
  .bld .box{padding:10px 11px}
  .bld .box > b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
  .pri{list-style:none;margin:7px 0 0;padding:0;display:grid;gap:3px}
  .pri li{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 7px;
    border-radius:8px;background:#00000040;border:1px solid var(--line-soft)}
  .pri li.top{border-color:hsla(140,70%,60%,.35);color:var(--acc)}
  .pri li u{text-decoration:none;font-family:var(--mono);font-size:10px;color:var(--tx3);
    min-width:12px}
  .pri li.top u{color:var(--acc)}
  /* Панель инструментов открывается как в трекере: слева колонка разделов,
     справа содержимое. Колонка никуда не девается — из «плана» можно сразу
     перейти в «готовность», не закрывая окно. */
  .tmnav{flex:none;width:236px;padding:12px;display:flex;flex-direction:column;gap:3px;
    border-right:1px solid var(--line);background:linear-gradient(180deg,#ffffff06,transparent);
    max-height:calc(100vh - 90px);overflow:auto}
  .tmi{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:11px;
    background:none;border:1px solid transparent;color:var(--tx2);cursor:pointer;
    font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;transition:.14s}
  .tmi:hover{background:#ffffff0a;border-color:var(--line);color:var(--tx)}
  .tmi.on{background:hsla(140,70%,60%,.12);border-color:var(--acc);color:var(--acc)}
  .tmi i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--tx3);
    margin-top:3px;letter-spacing:0;text-transform:none}
  .tmi.on i{color:hsla(140,70%,60%,.65)}
  .tmbody{flex:1;min-width:0;max-height:calc(100vh - 90px);overflow:auto}
  .sheet-in.tm{display:flex;gap:0;padding:0;max-width:1480px;overflow:hidden}
  .sheet-in.tm .tmbody>*{padding-left:18px;padding-right:18px}
  @media(max-width:900px){
    .sheet-in.tm{display:block}
    .tmnav{width:auto;flex-direction:row;overflow:auto;border-right:0;
      border-bottom:1px solid var(--line);max-height:none}
    .tmi{white-space:nowrap}
    .tmi i{display:none}
  }
  .tools{position:relative}
  .toolsm{position:absolute;right:0;top:calc(100% + 7px);min-width:230px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:5px;
    box-shadow:0 14px 34px #000000b0;display:none}
  .tools.open .toolsm{display:grid;gap:2px}
  .toolsm button{display:block;width:100%;text-align:left;background:transparent;border:0;
    color:var(--tx);padding:8px 10px;border-radius:9px;cursor:pointer;
    font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase}
  .toolsm button:hover{background:hsla(0,0%,100%,.06)}
  .toolsm button.on{color:var(--acc)}
  .toolsm button i{display:block;font-style:normal;font-size:10.5px;font-weight:500;
    letter-spacing:0;text-transform:none;color:var(--tx2);margin-top:3px}

  /* карта */
  /* Колонка категорий слева, карта справа и во всю оставшуюся ширину.
     Была наоборот и уже 300 пикселей — карта занимала меньше половины
     экрана, и разглядывать на ней было нечего. */
  .maprow{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:start}
  /* Карта — строго квадрат: плитки нарезаны квадратами, и доли точек считаются
     от квадрата. Когда её растянули на всю ширину окна (height вместо
     пропорции), подложка поехала по горизонтали, а значки перестали совпадать
     с улицами — это и выглядело как «всё смещено». Держим квадрат по меньшей
     из сторон: ширине колонки и высоте экрана. */
  /* Окно карты — прямоугольник во всю ширину колонки и почти во всю высоту
     экрана. Полотно внутри остаётся квадратом (.mapin с aspect-ratio), просто
     теперь по бокам от него не пустые поля, а продолжение карты: есть куда
     тащить. contain отрезает пересчёт остальной страницы при панорамировании. */
  /* Высота. Раньше карта упиралась в высоту экрана и на широком мониторе
     занимала меньше половины окна: справа гектар пустоты. Теперь берём
     большее из «высота экрана» и «62 % ширины окна» — на 2K это полторы
     тысячи пикселей вместо тысячи, ценой небольшой прокрутки страницы. */
  .mapwrap{position:relative;width:100%;
    height:min(1600px, max(calc(100vh - 124px), 62vw));
    min-height:460px;overflow:hidden;contain:layout paint;
    border:1px solid var(--line);border-radius:16px;background:#0b0d10;
    /* Обычная стрелка. Ни «рука», ни перекрестие себя не оправдали: в
       системной теме курсоров они могут выглядеть как угодно, а стрелка
       узнаётся всегда. Над точкой становится указателем, при перетаскивании
       карты — кулаком. */
    cursor:default}
  .mapwrap:fullscreen{height:100vh;border:0;border-radius:0}
  .mapwrap.grab{cursor:grabbing}
  /* Ширину и высоту ставит скрипт: сторона окна × приближение. Масштабировать
     полотно трансформацией нельзя — браузер тогда растягивает готовый растр
     вместо того, чтобы перерисовать плитки в нужном размере. */
  .mapin{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  /* Плитки раскладываются не сеткой, а поштучно: скрипт рисует только те,
     что попали в окно. На слое 25×25 это 15-20 картинок вместо 625. */
  .maptiles{position:absolute;inset:0}
  .maptiles img{position:absolute;display:block;user-select:none}
  /* Точки рисуются на холсте поверх подложки — узлов у них больше нет.
     Три с половиной тысячи отдельных элементов браузер честно раскладывал и
     перекрашивал при каждом движении карты, и на этом всё вставало. Холст
     живёт в экранных координатах: перерисовать пару сотен кружков дешевле,
     чем заставить браузер двигать тысячи элементов.
     Мышь холст не ловит — события висят на самом окне карты. */
  .mapcv{position:absolute;inset:0;pointer-events:none;z-index:3}
  .maptip{position:absolute;display:none;z-index:7;pointer-events:none;
    max-width:300px;background:rgba(10,12,16,.96);border:1px solid var(--line-hard);
    border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--tx);
    box-shadow:0 4px 14px #0009;align-items:center;gap:9px;line-height:1.25}
  .maptip.on{display:flex}
  .maptip img{width:44px;height:44px;object-fit:contain;flex:0 0 auto;
    background:#ffffff08;border-radius:8px;padding:3px}
  .maptip span{min-width:0}
  .maptip .tip-more{display:block;margin-top:3px;font-style:normal;font-size:10.5px;
    color:var(--tx3);line-height:1.4}
  .mapzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;z-index:6}
  .mapzoom button{width:32px;height:32px;border-radius:9px;background:rgba(12,14,18,.85);
    border:1px solid var(--line);color:var(--tx);cursor:pointer;font-size:15px;line-height:1}
  .mapzoom button:hover{border-color:var(--acc)}
  /* колонка категорий справа */
  /* колонка не тянется вслед за картой: липнет к верху и прокручивается сама */
  .mapside{border:1px solid var(--line-soft);border-radius:16px;background:var(--pan);
    padding:12px;position:sticky;top:12px;
    max-height:calc(100vh - 124px);overflow:auto}
  .mapside-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mapside-h b{font-family:var(--disp);font-size:15px;color:var(--tx)}
  .mapside-h span{margin-left:auto;display:flex;gap:5px}
  .mapside-h button{padding:4px 9px;border-radius:8px;background:var(--pan2);
    border:1px solid var(--line);color:var(--tx3);cursor:pointer;font-size:10.5px}
  .mapside-h button:hover{border-color:var(--acc);color:var(--tx)}
  /* тип точек в колонке: сворачивается, со своим счётчиком и кнопкой */
  .mgrp{border-top:1px solid var(--line-soft);margin-top:4px}
  .mgrp:first-of-type{border-top:0;margin-top:0}
  .mgrp>summary{display:flex;align-items:center;gap:7px;padding:7px 4px;cursor:pointer;
    list-style:none}
  .mgrp>summary::-webkit-details-marker{display:none}
  .mgrp>summary i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .mgrp>summary b{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--tx2)}
  .mgrp>summary em{font-style:normal;font-size:10.5px;color:var(--tx3)}
  .mgrp>summary button{margin-left:auto;padding:3px 8px;border-radius:7px;background:var(--pan2);
    border:1px solid var(--line);color:var(--tx3);cursor:pointer;font-size:10px}
  .mgrp>summary button:hover{border-color:var(--acc);color:var(--tx)}
  .mgrp[open]>summary b{color:var(--tx)}
  .mapcats{display:flex;flex-direction:column;gap:2px;padding:0 0 6px}
  .mcat{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:9px;
    cursor:pointer;font-size:11.5px;color:var(--tx2)}
  .mcat:hover{background:var(--pan2)}
  .mcat.off{opacity:.4}
  .mcat input{width:13px;height:13px;flex:none;accent-color:var(--acc)}
  .mcat img{width:18px;height:18px;object-fit:contain;flex:none}
  .mcat i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;margin:0 4px}
  .mcat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mcat em{font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono),monospace}
  .mapbar{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
  .mapbar button{padding:6px 10px;border-radius:9px;background:var(--pan2);
    border:1px solid var(--line);color:var(--tx2);cursor:pointer;font-size:11px}
  .mapbar button:hover{border-color:var(--acc);color:var(--tx)}
  .mapbar label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.5px}
  .mapbar input{width:70px;padding:5px 7px;border-radius:8px;background:var(--pan2);
    border:1px solid var(--line);color:var(--tx);font-family:var(--mono),monospace;font-size:11px}

  /* планировщик прокачки: два поля уровня рядом */
  .lvpair{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 9px}
  .lvpair label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.6px}
  .lvpair input{width:78px;padding:7px 9px;border-radius:10px;background:var(--pan);
    border:1px solid var(--line);color:var(--tx);font-family:var(--disp);font-size:15px}

  /* Переключение обликов эспера. Ряд миниатюр справа сверху убран: арты
     обрезаны по-разному, и в узкой плитке половина скинов показывала пустой
     угол картинки. Вместо него — стрелки, и видны они всегда: раньше
     проявлялись только при наведении, и о скинах можно было не узнать. */
  .lk-a{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:60px;
    border:1px solid hsla(0,0%,100%,.16);border-radius:11px;background:rgba(8,10,14,.62);
    color:#fff;font-size:24px;line-height:1;cursor:pointer;opacity:.85;transition:.15s;
    z-index:3;backdrop-filter:blur(3px)}
  .lk-a:hover{opacity:1;background:rgba(8,10,14,.85);border-color:var(--acc)}
  .lk-a.l{left:8px} .lk-a.r{right:8px}
  /* «2 / 5» под стрелками: сколько всего обликов и какой сейчас */
  .lk-num{position:absolute;right:10px;top:10px;z-index:3;font-size:10px;font-weight:800;
    letter-spacing:.1em;color:var(--tx2);background:rgba(8,10,14,.62);padding:4px 9px;
    border-radius:999px;border:1px solid hsla(0,0%,100%,.14);backdrop-filter:blur(3px)}
  .lk-name{position:absolute;left:12px;bottom:10px;z-index:3;font-size:11px;color:var(--tx2);
    background:rgba(8,10,14,.6);padding:4px 9px;border-radius:9px;backdrop-filter:blur(4px)}
  .lk-name i{font-style:normal;display:block;font-size:9.5px;color:var(--tx3)}

  /* тюнинг: узел раскрывается */
  .node{border:1px solid var(--line-soft);border-radius:12px;background:var(--pan);
    margin-bottom:6px;overflow:hidden}
  .node[open]{border-color:var(--line)}
  .node>summary{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
    list-style:none;font-size:12.5px;color:var(--tx2)}
  .node>summary::-webkit-details-marker{display:none}
  .node>summary b{color:var(--tx);font-size:12.5px}
  .node>summary em{margin-left:auto;font-style:normal;font-size:10px;color:var(--tx3);
    font-family:var(--mono),monospace}
  /* Варианты внутри узла — в несколько колонок. У Грифона в одном узле два
     десятка деталей, и лентой вниз раскрытая машина уезжала на три экрана.
     Раскрытый узел при этом занимает всю ширину блока, иначе колонки негде
     разложить. */
  .node-in{padding:0 12px 10px;display:grid;gap:6px;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));align-items:start}
  .wide>.node[open]{grid-column:1/-1}
  .tune{padding:8px 10px;border-radius:10px;background:var(--pan2);border:1px solid var(--line-soft)}
  .tune.std{border-color:hsla(140,70%,60%,.28)}
  .tune-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tune-t b{font-size:12px;color:var(--tx);flex:1;min-width:120px}
  .tune-s{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  /* цена значком валюты */
  .cash{display:inline-flex;align-items:center;gap:4px}
  .cash img{width:15px;height:15px;object-fit:contain}
  .cash b{font-family:var(--disp);font-size:13px;color:var(--tx)}
  .flat-ic{width:96px;height:62px;object-fit:cover}
  .flat-big{width:100%;border-radius:12px;display:block;margin:4px 0 2px}

  /* фотографии интерьера: крупный кадр и лента миниатюр под ним */
  .gal{margin:4px 0 2px}
  /* Рамка у фотографий квартир нарисована прямо в картинке: чёрное поле со
     скруглёнными углами по краю кадра. Убрать её из файла нельзя — она часть
     ассета, — поэтому обрезаем показом: кадр в окне с overflow, картинка чуть
     крупнее окна. Восемь процентов хватает, чтобы рамка ушла за край. */
  .gal-win{position:relative;width:100%;overflow:hidden;border-radius:12px;
    background:#0c0d10;aspect-ratio:1}
  .gal-big{position:absolute;inset:-4.5%;width:109%;height:109%;display:block;
    object-fit:cover;transition:opacity .45s ease}
  .gal-big.fade{opacity:0}
  .gal-cap{margin:6px 0 0;font-size:11.5px;color:var(--tx2)}
  .gal-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
  .gal-t{padding:0;border:1px solid var(--brd);border-radius:8px;overflow:hidden;
         background:none;cursor:pointer;line-height:0;opacity:.55;transition:.15s}
  .gal-t:hover{opacity:.85}
  .gal-t.on{opacity:1;border-color:var(--gold)}
  .gal-t img{width:74px;height:48px;object-fit:cover;display:block}

  /* коды: сверху сам код и кнопка, снизу награда и срок */
  .codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
  /* Зелёная подсветка невведённого кода — вернул: при новой раскладке карточки
     стали одинаково серыми, и взглядом было не отделить «ещё не забрал» от
     «уже ввёл». Введённые гаснут и теряют подсветку. */
  .code{display:block;padding:11px 13px;border-radius:14px;
    background:linear-gradient(135deg,hsla(140,70%,60%,.10),var(--pan));
    border:1px solid hsla(140,70%,60%,.32);transition:.15s;
    box-shadow:inset 0 0 30px hsla(140,70%,60%,.05)}
  .code:hover{border-color:var(--acc);box-shadow:0 0 22px hsla(140,70%,60%,.16)}
  .code .code-t b{color:var(--acc)}
  .code.done-c{opacity:.45;background:var(--pan);border-color:var(--line-soft);
    box-shadow:none}
  .code.done-c .code-t b{color:var(--tx2)}
  .code-t{display:flex;align-items:center;gap:9px}
  .code-t b{font-family:var(--mono),monospace;font-size:14px;color:var(--tx);
    letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .code.done-c .code-t b{text-decoration:line-through}
  .code-t button{padding:5px 10px;border-radius:8px;background:var(--pan2);
    border:1px solid var(--line);color:var(--tx2);cursor:pointer;font-size:10.5px;flex:none}
  .code-t button:hover{border-color:var(--acc);color:var(--tx)}
  .code-t button.done{border-color:var(--acc);color:var(--acc)}
  .code-r{margin-top:8px;display:flex;flex-wrap:wrap;gap:0}
  .code-d{margin-top:6px;font-size:10.5px;color:var(--tx3)}

  /* пробуждения: ступени A1…A6 и резонансы */
  /* карточка ступени нажимается: отмечаешь то, что выбрал себе в игре */
  .awk[data-awk]{cursor:pointer}
  .awk[data-awk]:hover{border-color:var(--line-hard)}
  .awks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:9px}
  .awk{padding:11px 13px;border-radius:14px;background:var(--pan);
    border:1px solid var(--line-soft);opacity:.55;transition:.15s}
  .awk.on{opacity:1;border-color:hsla(140,70%,60%,.35);
    background:linear-gradient(135deg,hsla(140,70%,60%,.07),var(--pan))}
  .awk-h .m{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:var(--acc);border:1px solid hsla(140,70%,60%,.4);border-radius:999px;padding:2px 8px}
  /* ступень, которую советуют брать первой */
  .awk-h .m.top{color:var(--gold);border-color:hsla(41,100%,50%,.45)}
  /* умения эспера: ярлык вида «Пассивная способность» и текст описания */
  .kit-k{font-style:normal;text-decoration:none;font-size:8.5px;font-weight:900;
    letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
    border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex:none}
  .kit-d{font-size:12.5px;line-height:1.7;color:var(--tx2)}
  .awk.want{border-color:hsla(41,100%,50%,.3)}
  .awk-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .awk-h img{width:38px;height:38px;object-fit:contain;flex:none;border-radius:9px;
    background:#0d0f14;border:1px solid var(--line);padding:2px}
  .awk-h u{font-style:normal;text-decoration:none;font-size:9px;font-weight:900;
    letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
  .awk-h b{font-size:13.5px;color:var(--gold);flex:1;min-width:120px}
  .awk.on .awk-h u{color:var(--acc)}
  .awk-d{margin-top:8px;font-size:12px;line-height:1.65;color:var(--tx2)}

  /* полоса портретов на вкладке «Команды» */
  .roster{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .rost{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:5px 3px;
    border-radius:12px;background:var(--pan);border:1px solid var(--line-soft);cursor:pointer;
    transition:.15s}
  .rost:hover{border-color:var(--line);transform:translateY(-1px)}
  .rost.on{border-color:var(--acc);background:hsla(140,70%,60%,.08)}
  .rost img{width:44px;height:44px;border-radius:10px;object-fit:cover;
    filter:grayscale(.6) brightness(.8);transition:.15s}
  .rost.on img{filter:none}
  .rost span{font-size:9px;color:var(--tx3);max-width:56px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rost.clr{width:auto;padding:5px 12px;justify-content:center;color:var(--tx3);font-size:11px}

  /* набор картриджей: карточка раскрывается */
  .suit{border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));transition:.2s}
  /* Раскрытая карточка занимает всю ширину списка. Без этого она оставалась в
     своей колонке шириной 330 пикселей, и «в ширину» раскрываться было просто
     некуда: внутренняя сетка складывалась в одну колонку и всё уезжало вниз. */
  .list>.suit[open]{grid-column:1/-1}
  .suit[open]{border-color:var(--line);background:var(--pan2)}
  .suit>summary{display:flex;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;
    align-items:flex-start}
  .suit>summary::-webkit-details-marker{display:none}
  .suit>summary:after{content:'';margin-left:auto;align-self:center;width:7px;height:7px;
    border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);
    transform:rotate(45deg);transition:.2s;flex:none}
  .suit[open]>summary:after{transform:rotate(-135deg)}
  /* Раскрытая карточка раскладывается в колонки слева направо. До этого всё
     шло одной лентой вниз: у машины с двадцатью узлами тюнинга раскрытая
     карточка уезжала на два экрана, и до раскрасок надо было листать.
     Разделы («Характеристики», «Тюнинг», «Раскраски») — это .sec, они и
     встают рядом; внутри каждого раздела своя сетка. */
  .suit-in{padding:0 14px 14px;display:grid;gap:0 18px;align-items:start;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .sec{min-width:0}
  .sec.full{grid-column:1/-1}
  .wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:9px;align-items:start}
  /* мебель и прочие карточки-описания: узкие колонки, чтобы вставало
     по три-четыре в ряд, а не по две широких */
  .sec.full .wide{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  /* характеристики машины: значение со стока и потолок с тюнингом */
  /* Характеристики машины — плитками в несколько колонок. Столбиком они не
     помещались даже на FullHD: у Пендрагона девять характеристик, и половина
     уезжала за экран. */
  .vstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .vst{padding:8px 11px;border-radius:11px;background:var(--pan);border:1px solid var(--line-soft)}
  .vst i{display:block;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--tx3)}
  .vst-n{display:flex;align-items:baseline;gap:6px;margin-top:3px}
  .vst-n b{font-family:var(--disp);font-size:19px;color:var(--tx);line-height:1}
  .vst-n s{text-decoration:none;font-size:11px;color:var(--acc)}
  .vst-b{margin-top:6px;height:4px;border-radius:3px;background:#ffffff12;overflow:hidden;
    position:relative}
  .vst-b u{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:3px}
  .vst-b em{position:absolute;inset:0 auto 0 0;background:hsla(140,70%,60%,.45);border-radius:3px}
  .parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .part{display:flex;gap:9px;padding:8px 10px;border-radius:12px;background:var(--pan);
    border:1px solid var(--line-soft);align-items:flex-start}
  .part img{width:44px;height:44px;object-fit:contain;flex:none;border-radius:9px;
    background:#0d0f14;border:1px solid var(--line);padding:2px}
  .part-b{min-width:0}
  .part-b b{font-size:12.5px;color:var(--tx)}
  /* что может выпасть */
  .drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:7px}
  .drop{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:11px;
    background:var(--pan);border:1px solid var(--line-soft);font-size:11.5px}
  .drop>span{flex:1;color:var(--tx2)}
  .dv{display:flex;gap:9px}
  .sv{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--tx3)}
  .sv b{font-family:var(--disp);font-size:13px;color:var(--tx)}
  .sv i{font-style:normal}

  /* скины */
  .skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
  .skin{border:1px solid var(--line-soft);border-radius:15px;overflow:hidden;cursor:pointer;
    background:linear-gradient(135deg,hsla(0,0%,100%,.03),rgba(10,10,10,.8));transition:.2s}
  .skin:hover{border-color:var(--line);transform:translateY(-2px)}
  .skin img,.skin-no{width:100%;height:210px;object-fit:cover;display:block;background:#0d0f14}
  .skin-b{padding:9px 11px 11px}
  .skin-b b{font-family:var(--disp);font-size:14px;color:var(--tx)}
  .skin-b i{display:block;font-style:normal;font-size:10.5px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  /* значки характеристик — родные игровые, из UI_Icon/Attribute */
  .sti{width:16px;height:16px;object-fit:contain;flex:none;opacity:.85;
    vertical-align:-3px;margin-right:5px}
  .goal .sti{margin-right:0}

  /* награда за код: значок предмета вместо голого английского названия */
  .rw{display:inline-flex;align-items:center;gap:5px;margin:2px 6px 2px 0;padding:2px 8px 2px 3px;
    border:1px solid var(--line-soft);border-radius:9px;background:var(--pan);
    font-size:11px;color:var(--tx2);vertical-align:middle}
  .rw img{width:20px;height:20px;object-fit:contain}
  .rw b{font-family:var(--disp);font-size:13px;color:var(--tx)}

  /* ── сворачиваемые блоки в карточке ── */
  .fold{border:1px solid var(--line);border-radius:13px;background:var(--pan2);
    overflow:hidden;margin-top:8px}
  .fold>summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--tx2);
    list-style:none;display:flex;align-items:center;gap:8px}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:before{content:'▸';color:var(--tx3);font-size:11px}
  .fold[open]>summary:before{content:'▾'}
  .fold>summary b{color:var(--tx)}
  .fold>summary img{width:26px;height:26px;border-radius:7px;object-fit:cover;background:#0d0f14}
  .fold-in{padding:0 13px 13px}

  /* ── тир-лист: роли колонками ──
     Как на prydwen: сверху заголовки ролей, под ними эсперы своей колонкой.
     Раньше роли шли строками одна под другой, и сравнить «кто сильнее среди
     ДД» приходилось, прыгая глазами через всю ширину. */
  .tgrid{display:grid;gap:8px;align-items:stretch}
  .thead{display:contents}
  .thead > div{position:sticky;top:56px;z-index:5;background:var(--panel);
    padding:8px 10px;border:1px solid var(--line-soft);border-radius:12px;
    font-size:9px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;
    color:var(--tx2);display:flex;align-items:center;gap:7px;justify-content:center}
  .thead > div img{width:17px;height:17px}
  .thead > div.corner{border-color:transparent;background:transparent}
  .tcell{background:var(--pan);border:1px solid var(--line-soft);border-radius:14px;
    padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:64px}
  .tcell.empty-c{background:transparent;border-style:dashed;opacity:.35}
  .tlab{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:.02em;
    color:var(--tier,var(--gold));display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,color-mix(in srgb,var(--tier,#ffb800) 10%,transparent),
      rgba(10,10,10,.8));
    border:1px solid color-mix(in srgb,var(--tier,#ffb800) 40%,transparent);
    border-radius:14px;
    box-shadow:0 0 28px color-mix(in srgb,var(--tier,#ffb800) 12%,transparent)}
  .ta{width:72px;cursor:pointer;text-align:center;transition:.12s;position:relative}
  .ta:hover{transform:translateY(-2px)}
  .ta .pic{position:relative}
  .ta img.p{width:62px;height:62px;border-radius:12px;object-fit:cover;
    border:1px solid var(--line);background:#0d0f14;display:block;margin:0 auto}
  .ta .badges{position:absolute;left:5px;top:-3px;display:flex;gap:2px}
  .ta .badges img{width:17px;height:17px;background:#000000c4;border-radius:50%;padding:1.5px}
  .ta span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:hsla(0,0%,100%,.4);margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
