  .ocr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}

  /* Скрины скопом: зона броска и карточки разобранных снимков. Карточки —
     один уровень, несколько колонок, выровнены между собой; распознанный
     текст раскрывается не под карточкой, а в широкой полосе справа от сетки,
     чтобы список не прыгал. */
  .drop{border:1.5px dashed var(--line);border-radius:14px;padding:26px 16px;
    text-align:center;background:var(--pan2);cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--acc);background:#191919}
  .drop b{display:block;font-size:13px;margin-bottom:4px}
  .drop span{color:var(--tx2);font-size:11px}
  .ocrwrap{display:grid;grid-template-columns:1fr;gap:12px}
  .ocrwrap.with-txt{grid-template-columns:minmax(0,1fr) minmax(280px,420px)}
  .ocrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:9px;align-items:start}
  .ocrc{background:var(--pan2);border:1px solid var(--line);border-radius:13px;
    padding:9px;display:grid;grid-template-rows:auto auto auto;gap:7px}
  .ocrc.bad{border-color:#fbbf2455}
  .ocrc.work{opacity:.6}
  .ocrc img{width:100%;height:74px;object-fit:cover;object-position:top;
    border-radius:9px;background:#0d0f14;display:block}
  .ocrc select{width:100%}
  .ocrc .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;
    font-family:var(--mono);font-size:11px}
  .ocrc .st i{font-style:normal;color:var(--tx3)}
  .ocrc .st b{font-weight:600;text-align:right}
  .ocrc .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
  .ocrc .row em{font-style:normal;font-size:10px;color:var(--tx3)}
  .ocrtxt{background:var(--pan2);border:1px solid var(--line);border-radius:13px;
    padding:10px;font-family:var(--mono);font-size:11px;line-height:1.5;
    white-space:pre-wrap;max-height:70vh;overflow:auto}
  .ocrbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .ocrpb{height:4px;border-radius:3px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
  .ocrpb i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
  @media(max-width:820px){ .ocrwrap.with-txt{grid-template-columns:1fr} }
  .pieces-row{display:flex;gap:8px;flex-wrap:wrap}
  .pcs{background:var(--pan2);border:1px solid var(--line);border-radius:11px;
    padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}
  .pcs .shp{display:grid;gap:1px}
  .pcs .shp i{width:7px;height:7px;border-radius:1px;background:var(--tx3)}
  .pcs.extra{opacity:.62;border-style:dashed}
  .pcs b{font-family:var(--mono);font-size:12px;color:var(--tx)}
  .pcs i{font-style:normal;font-size:10px;color:var(--tx3)}

  .hint{color:var(--tx2);font-size:11px;line-height:1.65;margin-top:9px}
  .empty{color:hsla(0,0%,100%,.25);font-size:10px;font-weight:800;letter-spacing:.26em;
    text-transform:uppercase;padding:34px 0;text-align:center}

  @media(max-width:820px){
    /* Шапка: кнопки по центру, поиск во всю ширину под ними — иначе он висел
       справа отдельной строкой и выглядел приклеенным сбоку. */
    .top-in{justify-content:center;gap:9px}
    .tabs{justify-content:center}
    .top-in .srch{margin-left:0;flex:1 1 100%;min-width:0}
    .logo{width:100%;justify-content:center}
    /* значки стихии и роли на плитке эспера были почти с портрет */
    .card-e img{width:16px;height:16px;padding:1.5px}
    .card-t{font-size:10px;padding:2px 6px}
    .fbar{gap:9px}
    .fb{padding:5px 9px;font-size:11.5px}
    .fb img{width:14px;height:14px}
    /* position:static тут был ошибкой: сама картинка внутри лежит absolute, и
       без позиционированного родителя она растягивалась на всю карточку —
       арт заливал экран и перекрывал сборку. Держим relative, липкость на
       телефоне не нужна: колонки одна под другой. */
    /* На телефоне карточка прокручивается целиком, поэтому высоту ограничиваем
       и колонки ставим одна под другой. */
    .sheet-in{max-height:100%;display:block;overflow-y:auto}
    .sh-head{display:block}
    .sh-body{overflow:visible;max-height:none}
    .sh-art{width:100%;height:46vh;max-height:360px;border-radius:18px 18px 0 0}
    .sh-art img{object-position:center 6%}
    .sh-body{padding:14px 14px 20px}
    /* шапка тянется во всю ширину тела, поэтому отступы под мобильные */
    .sh-title{margin:-14px -14px 10px;padding:14px 14px 12px}
    .fact b{max-width:150px}
    /* на телефоне карта сверху, колонка категорий под ней */
    .maprow{grid-template-columns:minmax(0,1fr)}
    /* на телефоне окно по ширине экрана: квадрат полотна в него как раз влезает */
    .mapwrap{height:96vw;min-height:300px;order:-1}
    .mapside{position:static;max-height:none}
    .mapside{max-height:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
    .sh-title h2{font-size:22px}
    .sheet{padding:10px 8px}
    .htabs{gap:4px}
    .htab{padding:6px 11px;font-size:12px}
    .cell{width:30px;height:30px}
    /* на узком экране сетка и палитра деталей должны идти друг под другом */
    .plan{gap:12px}
    .plan-l,.plan-r{flex:1 1 100%;min-width:0}
    .inp{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
    .team{gap:8px}
    .team-n{flex:1 1 100%}
    .tgrid{font-size:12px}
    /* sticky здесь считался от десктопной шапки (top:56px) — на телефоне она
       вдвое выше, и подпись роли зависала прямо над портретами. Липкость на
       узком экране не нужна: таблица и так листается целиком. */
    .thead > div{position:static;padding:6px;font-size:11px;
      flex-direction:column;gap:2px;text-align:center}
  }
  /* Совсем узкие экраны: три колонки ролей в 375px не влезают. Схлопывать их
     нельзя — тогда ячейки разъезжаются по строкам и тир перестаёт совпадать с
     ролью. Поэтому оставляем таблицу как есть и даём листать её вбок. */
  @media(max-width:560px){
    #body{overflow-x:auto}
    /* 540 не хватало: в колонке помещался ровно один портрет, и тир-лист
       вытягивался в узкие полосы. 640 дают по два в ряд. */
    .tgrid{min-width:640px}
    .thead > div{font-size:10.5px;padding:5px}
    .ta{width:64px}
    .ta img.p{width:56px;height:56px}
    .ta span{font-size:9.5px}
  }
</style>
</head>
<body>

<div class="top"><div class="wrap top-in">
  <div class="logo">NTE<b>·</b><i id="ver"></i></div>
  <div class="tabs" id="tabs"></div>
  <div class="top-sp"></div>
  <!-- Панели собраны в одно меню: четырьмя кнопками в ряд шапка перерастала
       в две строки и съедала экран. -->
  <div class="tools" id="tools">
    <button class="cloudb" id="toolsBtn" title="Облако, план, сравнение, скрины">☰ Инструменты</button>
    <div class="toolsm">
      <button data-tool="cloud" id="cloudBtn">облако<i>синхронизация между устройствами</i></button>
      <button data-tool="plan">план<i>материалы на всех, кого качаешь</i></button>
      <button data-tool="cmp">сравнить<i>кого качать первым</i></button>
      <button data-tool="ready">готовность<i>все эсперы против целей гайда</i></button>
      <button data-tool="pulls">крутки<i>сколько до гаранта и хватит ли</i></button>
      <button data-tool="bak">мои данные<i>сохранить файлом и восстановить</i></button>
      <button data-tool="inst" id="instBtn" style="display:none">поставить приложением<i>иконка на рабочий стол, работает без сети</i></button>
      <button data-tool="stat">скрины<i>характеристики из снимков экрана</i></button>
    </div>
  </div>
  <!-- Поиск убран из шапки: на широком экране он уезжал вниз отдельной
       строкой и занимал полосу впустую. Фильтры на вкладках справляются. -->
  <input class="srch" id="q" type="search" placeholder="поиск" autocomplete="off" hidden>
</div></div>

<div class="wrap">
  <div class="fbar" id="filters"></div>
  <div id="body"></div>
  <div class="hint" id="foot"></div>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<script src="app.js?v=77" defer></script>
<script src="../menu.js" defer></script>
<script src="../install.js" defer></script>
</body>
</html>
