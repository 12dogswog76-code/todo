<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Политика безопасности содержимого. Внешних скриптов на странице нет —
     весь код лежит здесь же, поэтому чужие подключить нельзя вообще.
     object-src и base-uri закрыты наглухо: это классические лазейки. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<title>NTE — справочник</title>
<link rel="icon" href="../icon.svg">
<style>
  :root{
    color-scheme: dark;
    --bg:#08090c; --pan:#111318; --pan2:#171a21; --line:#242832;
    --tx:#e9ecf3; --tx2:#8b92a3; --tx3:#5a6070;
    --acc:#4ade80; --ok:#4ade80; --warn:#fbbf24; --info:#60a5fa; --gold:#ffd54a;
    --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,"Roboto Mono",monospace;
    --glass:1px 1px 0 #ffffff0f inset, -2px -3px 14px #00000073 inset;
    /* Цвета стихий NTE — по значкам из игры. Ими красится обводка карточек. */
    --Anima:#4ade80; --Chaos:#a78bfa; --Cosmos:#60a5fa;
    --Incantation:#fbbf24; --Lakshana:#f87171; --Psyche:#f472b6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px}
  /* Крупные экраны: вёрстка сделана под ~1400px, на FHD и 2K всё мелкое.
     zoom, а не transform: scale — последний ломает position:sticky и fixed,
     а нам нужен и липкий арт в карточке, и шапка. */
  @media (min-width:1900px){ body{zoom:1.25} }
  @media (min-width:2500px){ body{zoom:1.5} }
  body{padding:0 0 60px}
  a{color:var(--info)}
  .wrap{max-width:1560px;margin:0 auto;padding:0 18px}

  /* ── шапка и вкладки ── */
  .top{position:sticky;top:0;z-index:20;background:#08090ce8;backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:16px}
  .top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .logo b{color:var(--gold)}
  .logo i{font-style:normal;font-size:10px;color:var(--tx3);border:1px solid var(--line);
    border-radius:20px;padding:2px 8px}
  .tabs{display:flex;gap:5px;flex-wrap:wrap}
  .tb{background:var(--pan2);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
    border-radius:10px;padding:6px 14px;font-size:12.5px;font-family:inherit;transition:.12s}
  .tb:hover{border-color:var(--tx3);color:var(--tx)}
  .tb.on{border-color:var(--acc);color:#a7f3c0;font-weight:600;
    background:linear-gradient(180deg,#4ade8029,#4ade8014);box-shadow:0 0 14px #4ade8024}
  .top-sp{flex:1}
  .srch{background:var(--pan2);border:1px solid var(--line);border-radius:10px;color:var(--tx);
    padding:8px 13px;font-size:13px;font-family:inherit;min-width:180px}
  .srch:focus{outline:none;border-color:var(--acc)}

  /* ── фильтры ── */
  .fbar{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;align-items:center}
  .fgrp{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .fgrp>u{font-style:normal;text-decoration:none;font-size:10px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  .fb{background:var(--pan2);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
    border-radius:9px;padding:5px 11px;font-size:12px;font-family:inherit;transition:.12s;
    display:flex;align-items:center;gap:6px}
  .fb:hover{border-color:var(--tx3);color:var(--tx)}
  .fb.on{border-color:var(--acc);color:var(--tx);background:linear-gradient(180deg,#4ade8022,#4ade800a);
    box-shadow:0 0 12px #4ade8022}
  .fb img{width:16px;height:16px;object-fit:contain}
  .fcnt{font-size:11.5px;color:var(--tx3);margin-left:auto}

  /* ── сетка эсперов ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
  .card{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);
    border-radius:14px;overflow:hidden;cursor:pointer;transition:.14s;position:relative;
    box-shadow:var(--glass)}
  .card:hover{transform:translateY(-2px);border-color:var(--el,var(--tx3))}
  .card-p{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0d0f14}
  .card-p img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .card-p:after{content:'';position:absolute;inset:auto 0 0 0;height:55%;
    background:linear-gradient(180deg,#0b0d1100,#111318f2)}
  .card-t{position:absolute;top:7px;left:7px;z-index:2;font-size:11px;font-weight:800;
    border-radius:7px;padding:2px 7px;background:#000000b8;color:var(--gold)}
  .card-e{position:absolute;top:7px;right:7px;z-index:2;display:flex;gap:3px}
  .card-e img{width:19px;height:19px;background:#000000b8;border-radius:50%;padding:2px}
  .card-n{position:absolute;left:9px;right:9px;bottom:7px;z-index:2}
  .card-n b{display:block;font-size:13.5px;line-height:1.2;text-shadow:0 2px 6px #000,0 0 3px #000}
  .card-n i{font-style:normal;font-size:10px;color:var(--tx2)}

  /* ── карточка эспера ── */
  .sheet{position:fixed;inset:0;z-index:40;background:#05060988;backdrop-filter:blur(4px);
    display:none;overflow:auto;padding:24px 14px}
  .sheet.on{display:block}
  /* overflow тут держать нельзя: он делает карточку контейнером прокрутки, и
     position:sticky у арта прилипает к ней, а не к экрану — картинка стояла на
     месте, сколько ни листай. Скругление вешаем на сам арт и на тело. */
  .sheet-in{max-width:1180px;margin:0 auto;background:var(--pan);border:1px solid var(--line);
    border-radius:18px;box-shadow:0 24px 70px #000000b0}
  .sh-head{display:flex;gap:0;flex-wrap:wrap}
  /* Арт — крупный и чистый: подписи на нём не рисуем. Раньше имя со значком
     стихии лежало поверх картинки и на светлых артах читалось плохо.
     Едет за экраном при прокрутке — ровно как .hart в трекере ZZZ: sticky с
     ограничением по высоте окна. Без него картинка оставалась в начале
     карточки, и дальше сборку читаешь уже без неё. */
  .sh-art{flex:0 0 430px;position:sticky;top:14px;align-self:flex-start;
    background:#0d0f14;height:640px;max-height:calc(100vh - 44px);
    overflow:hidden;border-radius:18px 0 0 18px}
  .sh-art img{width:100%;height:100%;object-fit:cover;object-position:center 8%;
    position:absolute;inset:0}
  .sh-art:after{content:'';position:absolute;inset:auto 0 0 0;height:22%;
    background:linear-gradient(180deg,#0d0f1400,#0d0f14cc)}
  /* имя, латиница и «тир · стихия · роль» — в теле карточки, а не на арте */
  .sh-title{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .sh-title h2{margin:0;font-size:27px;font-weight:800;line-height:1.05}
  .sh-title h2 i{display:block;font-style:normal;font-size:12.5px;color:var(--tx3);
    font-weight:400;margin-top:2px}
  .sh-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;
    border-radius:9px;background:var(--pan2);border:1px solid var(--line);color:var(--tx)}
  .tag img{width:15px;height:15px}
  .tag.tier{color:var(--gold);font-weight:800}
  /* вкладки внутри карточки — те же, что в трекере ZZZ */
  .htabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .htab{background:var(--pan2);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
    border-radius:10px;padding:6px 14px;font-size:12.5px;font-family:inherit;transition:.12s}
  .htab:hover{border-color:var(--tx3);color:var(--tx)}
  .htab.on{border-color:var(--acc);color:#a7f3c0;font-weight:600;
    background:linear-gradient(180deg,#4ade8029,#4ade8014)}
  .sh-body{flex:1;min-width:320px;padding:18px 20px 22px}
  .sh-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--pan2);border:1px solid var(--line);
    border-radius:10px;padding:5px 11px;font-size:12px;color:var(--tx2)}
  .chip img{width:17px;height:17px}
  .chip b{color:var(--tx);font-weight:700}
  .chip.tier b{color:var(--gold);font-size:14px}
  .x{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--tx3);
    cursor:pointer;border-radius:9px;padding:5px 11px;font-size:13px;font-family:inherit}
  .x:hover{border-color:#f87171;color:#f87171}

  .cap{display:flex;align-items:center;gap:9px;margin:20px 0 9px}
  .cap:first-child{margin-top:0}
  .cap b{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--gold)}
  .cap span{flex:1;height:1px;background:var(--line)}
  .cap em{font-style:normal;font-size:10px;color:var(--tx3);border:1px solid var(--line);
    border-radius:20px;padding:1px 8px}

  .rows{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:10px;
    background:var(--pan2);border:1px solid var(--line);font-size:12.5px}
  .row u{font-style:normal;text-decoration:none;flex:0 0 18px;text-align:center;
    font-size:11px;color:var(--tx3);font-weight:700}
  .row b{flex:1;font-weight:600;color:var(--tx)}
  .row .m{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .row .pct{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700}
  .row.best{border-color:#ffd54a3d;background:linear-gradient(120deg,#ffd54a0f,var(--pan2))}
  .row .r-S{color:var(--gold)} .row .r-A{color:#c4b5fd}

  .prio{font-size:12.5px;line-height:1.7;color:var(--tx2);background:var(--pan2);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px}
  .prio b{color:var(--tx)}
  .prio .gt{color:var(--tx3);margin:0 3px}

  .goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .goal{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;
    background:var(--pan2);border:1px solid var(--line);font-size:12px}
  .goal span{flex:1;color:var(--tx2)}
  .goal b{color:var(--gold);font-family:var(--mono);font-weight:700}
  .goal.note{cursor:help}
  .goal u{font-style:normal;text-decoration:none;display:inline-flex;align-items:center;
    justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--tx3);
    color:var(--tx3);font-size:9px;font-weight:700;flex:none}

  .set{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .set-n{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px}
  .set-b{font-size:12px;line-height:1.55;color:var(--tx2);padding:4px 0}
  .set-b i{font-style:normal;color:var(--acc);font-weight:700;margin-right:6px}
  .pieces{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .pc{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--tx2);
    border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:var(--pan)}
  .trait{font-size:12px;line-height:1.55;color:var(--tx2);margin-top:9px;
    border-top:1px solid var(--line);padding-top:9px}
  .trait i{font-style:normal;color:var(--tx3);display:block;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}

  /* ── списки оружия и картриджей ── */
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:9px}
  .item{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--pan2);
    border:1px solid var(--line);box-shadow:var(--glass)}
  .item-ic{width:56px;height:56px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line)}
  .item-b{min-width:0;flex:1}
  .item-b b{display:block;font-size:13px;line-height:1.25;margin-bottom:2px}
  .item-b i{font-style:normal;font-size:11px;color:var(--tx3);line-height:1.5;display:block}
  .rar{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;
    border:1px solid var(--line);vertical-align:2px}
  .rar.S{color:var(--gold);border-color:#ffd54a4d;background:#ffd54a12}
  .rar.A{color:#c4b5fd;border-color:#a78bfa4d;background:#a78bfa12}
  .rar.B{color:#93c5fd;border-color:#60a5fa4d;background:#60a5fa12}

  /* ── тир-лист ── */
  .tier-row{display:flex;gap:12px;margin-bottom:9px;background:var(--pan2);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;align-items:flex-start;box-shadow:var(--glass)}
  .tier-l{flex:0 0 58px;font-size:22px;font-weight:800;text-align:center;color:var(--gold);
    padding-top:14px}
  .tier-l.t0{color:#fca5a5} .tier-l.t3{color:var(--tx3)}
  .tier-g{flex:1;display:flex;flex-wrap:wrap;gap:7px}
  .tier-a{width:74px;cursor:pointer;text-align:center;transition:.12s}
  .tier-a:hover{transform:translateY(-2px)}
  .tier-a img{width:64px;height:64px;border-radius:12px;object-fit:cover;
    border:1px solid var(--line);background:#0d0f14}
  .tier-a span{display:block;font-size:10px;color:var(--tx3);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── баннеры ── */
  .bgrp{margin-bottom:18px}
  .bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
  .bc{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--pan2);
    border:1px solid var(--line);box-shadow:var(--glass);align-items:center;cursor:default}
  .bc.live{border-color:#4ade8047;background:linear-gradient(120deg,#4ade800f,var(--pan2))}
  .bc.top{border-color:#ffd54a3d}
  .bc img{width:52px;height:52px;border-radius:11px;object-fit:cover;flex:none;
    background:#0d0f14;border:1px solid var(--line)}
  .bc-b{min-width:0;flex:1}
  .bc-b b{display:block;font-size:13px;line-height:1.25}
  .bc-b i{font-style:normal;font-size:10.5px;color:var(--tx3);display:block;line-height:1.5}
  .bc-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);
    border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-right:5px}
  .bc-k.arc{color:#c4b5fd;border-color:#a78bfa40}

  /* ── планировщик Console ── */
  .plan{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .plan-l{flex:0 0 auto}
  .plan-r{flex:1;min-width:280px}
  .board{display:grid;gap:3px;background:var(--pan2);border:1px solid var(--line);
    border-radius:14px;padding:10px;box-shadow:var(--glass)}
  .cell{width:42px;height:42px;border-radius:8px;background:#0d0f14;border:1px solid var(--line);
    cursor:pointer;transition:.1s;position:relative}
  .cell.off{background:transparent;border-color:transparent;cursor:default}
  .cell.on{border-color:transparent}
  .cell.hint{outline:2px solid var(--acc);outline-offset:-2px}
  .cell.bad{outline:2px solid #f87171;outline-offset:-2px}
  .cell b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-family:var(--mono);color:#0b0d11;font-weight:800}
  .pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pi{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;
    cursor:pointer;font-size:11.5px;color:var(--tx2);font-family:inherit;transition:.12s;
    display:flex;align-items:center;gap:7px}
  .pi:hover{border-color:var(--tx3);color:var(--tx)}
  .pi.on{border-color:var(--acc);color:var(--tx);background:linear-gradient(180deg,#4ade8022,#4ade800a)}
  .pi .shp{display:grid;gap:1px}
  .pi .shp i{width:6px;height:6px;background:var(--tx3);border-radius:1px}
  .pi.on .shp i{background:var(--acc)}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .st{background:var(--pan2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;
    font-size:12px;color:var(--tx3)}
  .st b{display:block;font-size:18px;color:var(--tx);font-variant-numeric:tabular-nums}
  .st.ok b{color:var(--acc)}

  /* ── команды ── */
  .team{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pan2);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px;
    box-shadow:var(--glass)}
  .team-l{flex:0 0 46px;font-size:17px;font-weight:800;text-align:center;color:var(--gold)}
  .team-l.t0{color:#fca5a5} .team-l.t3{color:var(--tx3)}
  .team-n{flex:0 0 170px;font-size:13px;font-weight:600;line-height:1.3}
  .team-n i{display:block;font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:400}
  .team-s{flex:1;display:flex;gap:7px;flex-wrap:wrap;min-width:240px}
  .slot{display:flex;gap:3px;background:var(--pan);border:1px solid var(--line);
    border-radius:11px;padding:4px}
  .slot .alt{width:56px;text-align:center;cursor:pointer;transition:.12s}
  .slot .alt:hover{transform:translateY(-2px)}
  .slot img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#0d0f14;
    border:1px solid var(--line);display:block;margin:0 auto}
  .slot span{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .syn{background:var(--pan2);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;margin-bottom:7px}
  .syn-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer}
  .syn-h img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#0d0f14}
  .syn-h b{font-size:13px}
  .syn ul{margin:0;padding-left:18px;color:var(--tx2);font-size:12px;line-height:1.6}

  /* ── коды ── */
  .code{display:flex;align-items:center;gap:11px;background:var(--pan2);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;box-shadow:var(--glass)}
  .code b{font-family:var(--mono);font-size:14px;color:var(--gold);letter-spacing:.5px;
    flex:0 0 auto;user-select:all}
  .code i{font-style:normal;font-size:11.5px;color:var(--tx2);flex:1;min-width:90px}
  .code em{font-style:normal;font-size:10.5px;color:var(--tx3)}
  .code button{background:var(--pan);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
    border-radius:8px;padding:4px 10px;font-size:11.5px;font-family:inherit}
  .code button:hover{border-color:var(--acc);color:var(--acc)}
  .code button.done{border-color:var(--acc);color:var(--acc)}

  /* ── механики и калькулятор ── */
  .doc{max-width:940px}
  .doc h2{font-size:16px;margin:22px 0 9px;color:var(--tx)}
  .doc h2:first-child{margin-top:0}
  .doc p{font-size:13px;line-height:1.7;color:var(--tx2);margin:0 0 9px}
  .doc ul{font-size:13px;line-height:1.7;color:var(--tx2);margin:0 0 9px;padding-left:20px}
  .doc b{color:var(--tx)}

  .box{background:var(--pan2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    margin-bottom:10px;box-shadow:var(--glass)}
  .box>b{display:block;font-size:13.5px;color:var(--gold);margin-bottom:5px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--tx3);font-weight:600;padding:6px 9px;border-bottom:1px solid var(--line)}
  .tbl td{padding:7px 9px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}

  .els{display:flex;gap:4px;align-items:center}

  .inp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-bottom:12px}

  .inp input:focus{outline:none;border-color:var(--acc)}
  .verdict{border:1px solid #4ade8047;background:linear-gradient(120deg,#4ade800f,var(--pan2));
    border-radius:13px;padding:11px 14px;font-size:13px;line-height:1.6;margin-bottom:12px}
  .verdict b{color:var(--acc)}
  .bar{height:7px;border-radius:6px;background:#0d0f14;border:1px solid var(--line);
    overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24)}

  /* ── оружие: карточка с раскрытием ── */
  .wp{background:var(--pan2);border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--glass);overflow:hidden}
  .wp-h{display:flex;gap:11px;padding:10px 12px;cursor:pointer;align-items:center}
  .wp-h:hover{background:#ffffff06}
  .wp-ic{width:56px;height:56px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line)}
  .wp-b{min-width:0;flex:1}
  .wp-b b{display:block;font-size:13px;line-height:1.25}
  .wp-b i{font-style:normal;font-size:11px;color:var(--tx3);display:block;line-height:1.5}
  .wp-own{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;
    border:1px solid #ffd54a55;background:#0d0f14}
  .wp-st{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .wp-st span{font-size:10.5px;font-family:var(--mono);color:var(--tx2);
    border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--pan)}
  .wp-st span b{display:inline;color:var(--gold);font-weight:700}
  .wp-x{color:var(--tx3);font-size:15px;flex:none;transition:.15s}
  .wp.open .wp-x{transform:rotate(180deg)}
  .wp-d{display:none;padding:0 12px 12px;border-top:1px solid var(--line)}
  .wp.open .wp-d{display:block}
  .lvl{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px;margin-top:9px}
  .lvl div{background:var(--pan);border:1px solid var(--line);border-radius:8px;
    padding:5px 8px;font-size:11px;color:var(--tx3);text-align:center}
  .lvl div b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--tx)}
  .lvl div.max{border-color:#ffd54a4d}
  .lvl div.max b{color:var(--gold)}

  /* ── картриджи ── */
  .cart{display:flex;gap:11px;padding:11px 12px;border-radius:13px;background:var(--pan2);
    border:1px solid var(--line);box-shadow:var(--glass);align-items:flex-start}
  .cart-ic{width:54px;height:54px;flex:none;border-radius:11px;object-fit:contain;
    background:#0d0f14;border:1px solid var(--line);padding:3px}
  .geo{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .geo u{font-style:normal;text-decoration:none;font-size:10px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.5px}
  .gsh{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;
    padding:3px 7px;background:var(--pan);font-size:10.5px;color:var(--tx2)}
  .gsh .mini{display:grid;gap:1px}
  .gsh .mini i{width:5px;height:5px;border-radius:1px;background:var(--tx3)}

  /* ── сворачиваемые блоки в карточке ── */
  .fold{border:1px solid var(--line);border-radius:13px;background:var(--pan2);
    overflow:hidden;margin-top:8px}
  .fold>summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--tx2);
    list-style:none;display:flex;align-items:center;gap:8px}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:before{content:'▸';color:var(--tx3);font-size:11px}
  .fold[open]>summary:before{content:'▾'}
  .fold>summary b{color:var(--tx)}
  .fold>summary img{width:26px;height:26px;border-radius:7px;object-fit:cover;background:#0d0f14}
  .fold-in{padding:0 13px 13px}

  /* ── тир-лист: роли колонками ──
     Как на prydwen: сверху заголовки ролей, под ними эсперы своей колонкой.
     Раньше роли шли строками одна под другой, и сравнить «кто сильнее среди
     ДД» приходилось, прыгая глазами через всю ширину. */
  .tgrid{display:grid;gap:8px;align-items:stretch}
  .thead{display:contents}
  .thead > div{position:sticky;top:56px;z-index:5;background:var(--bg);
    padding:7px 10px;border:1px solid var(--line);border-radius:11px;
    font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:7px;justify-content:center}
  .thead > div img{width:17px;height:17px}
  .thead > div.corner{border-color:transparent;background:transparent}
  .tcell{background:var(--pan2);border:1px solid var(--line);border-radius:13px;
    padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
    box-shadow:var(--glass);min-height:64px}
  .tcell.empty-c{background:transparent;border-style:dashed;opacity:.35}
  .tlab{font-size:21px;font-weight:800;color:var(--gold);display:flex;align-items:center;
    justify-content:center;background:var(--pan2);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--glass)}
  .tlab.t0{color:#fca5a5} .tlab.t3{color:var(--tx3)}
  .ta{width:72px;cursor:pointer;text-align:center;transition:.12s;position:relative}
  .ta:hover{transform:translateY(-2px)}
  .ta .pic{position:relative}
  .ta img.p{width:62px;height:62px;border-radius:12px;object-fit:cover;
    border:1px solid var(--line);background:#0d0f14;display:block;margin:0 auto}
  .ta .badges{position:absolute;left:5px;top:-3px;display:flex;gap:2px}
  .ta .badges img{width:17px;height:17px;background:#000000c4;border-radius:50%;padding:1.5px}
  .ta span{display:block;font-size:10px;color:var(--tx3);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .ocr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
  .pieces-row{display:flex;gap:8px;flex-wrap:wrap}
  .pcs{background:var(--pan2);border:1px solid var(--line);border-radius:11px;
    padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}
  .pcs .shp{display:grid;gap:1px}
  .pcs .shp i{width:7px;height:7px;border-radius:1px;background:var(--tx3)}
  .pcs b{font-family:var(--mono);font-size:12px;color:var(--tx)}
  .pcs i{font-style:normal;font-size:10px;color:var(--tx3)}

  .hint{color:var(--tx3);font-size:11.5px;line-height:1.55;margin-top:9px}
  .empty{color:var(--tx3);font-size:12.5px;padding:26px 0;text-align:center}

  @media(max-width:820px){
    .sh-art{flex:1 1 100%;height:300px;position:static;border-radius:18px 18px 0 0}
    .sh-body{padding:16px 15px 20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
    .sh-name b{font-size:24px}
    .cell{width:34px;height:34px}
  }
</style>
</head>
<body>

<div class="top"><div class="wrap top-in">
  <div class="logo">NTE<b>·</b><i id="ver"></i></div>
  <div class="tabs" id="tabs"></div>
  <div class="top-sp"></div>
  <input class="srch" id="q" type="search" placeholder="поиск" autocomplete="off">
</div></div>

<div class="wrap">
  <div class="fbar" id="filters"></div>
  <div id="body"></div>
  <div class="hint" id="foot"></div>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<script>
const APP_VER = 'v11';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);

let DB = null, GUIDE = null, RU = null, GEAR = null, I18N = null;

// ── перевод текстов с prydwen ──────────────────────────────────────────────
// Сами тексты приезжают с сайта по-английски и при каждом новом прогоне
// сборщика перезаписываются. Поэтому перевод лежит отдельным файлом-словарём
// «оригинал → русский»: данные можно пересобирать сколько угодно, перевод от
// этого не теряется. Чего в словаре нет — показываем как есть.
function tr(s) {
  if (!s) return s;
  const d = I18N && I18N.t;
  return (d && d[s]) || s;
}
// Приоритеты («Crit Rate > Crit DMG > ATK %») и порядок прокачки — это не
// предложения, а перечни через > и =. Переводим по токенам, разделители
// оставляем на месте.
const PRIO_RU = {
  'atk':'Атака', 'flat atk':'Атака (плоская)', 'flat attack':'Атака (плоская)',
  'atk %':'Атака %', 'hp':'HP', 'hp %':'HP %', 'def':'Защита', 'def %':'Защита %',
  'crit rate':'Шанс крита', 'crit rate %':'Шанс крита',
  'crit dmg':'Крит. урон', 'crit dmg %':'Крит. урон',
  'dmg':'Урон %', 'dmg %':'Урон %', 'dmg%':'Урон %',
  'break intensity':'Инт. разрушения', 'cycle intensity':'Инт. цикла',
  'healing bonus':'Бонус лечения', 'mental damage':'Ментальный урон',
  'anima dmg':'Урон Анимы', 'anima dmg %':'Урон Анимы',
  'chaos dmg':'Урон Хаоса', 'chaos dmg %':'Урон Хаоса',
  'cosmos dmg':'Урон Космоса', 'cosmos dmg %':'Урон Космоса',
  'incantation dmg':'Урон Заклинания', 'incantation dmg %':'Урон Заклинания',
  'lakshana dmg':'Урон Лакшаны', 'lakshana dmg %':'Урон Лакшаны',
  'psyche dmg':'Урон Психики', 'psyche dmg %':'Урон Психики', 'psyche damage':'Урон Психики',
  'basic':'Обычная', 'basics':'Обычные', 'skill':'Навык', 'ult':'Ульта',
  'ultimate':'Ульта', 'support':'Поддержка', 'support skill':'Навык поддержки',
  'passive 1':'Пассивка 1', 'passive 2':'Пассивка 2'
};
function prioRu(s) {
  return String(s || '').split(/(\s*(?:>>|>|=)\s*)/).map(p => {
    if (/^[\s>=]*$/.test(p)) return p;
    const t = p.trim().replace(/\s+/g, ' ');
    const ru = PRIO_RU[t.toLowerCase()];
    return ru ? p.replace(t, ru) : p;
  }).join('');
}
const RATE_RU = { Damage:'Урон', Support:'Поддержка', Hybrid:'Гибрид',
                  Survival:'Выживание', Buff:'Поддержка', 'Endgame PVE':'эндгейм PVE' };
// Награды за коды: валюты оставляем как в игре, служебные слова переводим.
function rewRu(s) {
  return String(s || '').replace(/\bMaterials\b/g, 'материалы').replace(/\bx(\d+)/g, '×$1');
}
const state = { tab: 'espers', q: '', el: '', role: '', tier: '', rar: '', plan: 'mint' };

// Команды, планировщик Console и калькулятор статов живут внутри карточки
// эспера: сами по себе, в отрыве от конкретного персонажа, они бесполезны.
const TABS = [
  ['espers', 'Эсперы'], ['arcs', 'Оружие'], ['carts', 'Картриджи'],
  ['tier', 'Тир-лист'], ['ban', 'Баннеры'], ['codes', 'Коды'], ['mech', 'Механики']
];

const EL_RU = { Anima:'Анима', Chaos:'Хаос', Cosmos:'Космос',
                Incantation:'Заклинание', Lakshana:'Лакшана', Psyche:'Психика' };
const ROLE_RU = { Damage:'Урон', Survival:'Выживание', Buff:'Поддержка' };
const TIERS = ['S+', 'S', 'A', 'B', 'C', 'D'];

const STAT_RU = {
  hp:'HP', atk:'Атака', def:'Защита', cr:'Шанс крита', cd:'Крит. урон',
  dmg:'Общий урон', brk:'Разрушение', er:'Восст. энергии',
  cyc:'Интенсивность цикла', elem:'Урон стихии'
};
const STAT_PCT = { cr:1, cd:1, dmg:1, elem:1, brk:1 };
const STAT_EN = { hp:'HP', atk:'ATK', def:'DEF', cr:'CRIT Rate', cd:'CRIT DMG',
                  cyc:'Cycle Intensity', brk:'Break Intensity', er:'Energy Regen' };

// Сетка Console у каждого эспера своя, и в игре она названа по внутреннему
// имени персонажа: Хотори — это Jin, Цзююань — kuhara, Аурелия — mitsuki.
// Опознано по текстам их же навыков в локализации.
const GRID_OF = {
  adler:'Adler', aurelia:'mitsuki', baicang:'Cang', chaos:'chaos', chiz:'chiichan',
  daffodil:'daffodill', edgar:'edgar', fadia:'Fadia', haniel:'Haniel', hathor:'Hathor',
  hotori:'Jin', iroi:'oneiroi', jiuyuan:'kuhara', lacrimosa:'lacrimosa', linko:'radio',
  mint:'Mint', nanally:'Nanally', sakiri:'Sagiri', shinku:'shinku', skia:'skia',
  zankou:'zankou', zero:'Female'
};

function ruName(kind, s) {
  if (!RU || !s) return s;
  const d = RU[kind];
  return (d && d[s]) || s;
}
function statName(k, a) {
  if (k === 'elem') return 'Урон: ' + ((a && EL_RU[a.el]) || 'стихии');
  const fromGame = RU && RU.stats && STAT_EN[k] ? RU.stats[STAT_EN[k]] : null;
  return fromGame || STAT_RU[k] || k;
}
const elIcon = el => 'img/ui/el-' + String(el).toLowerCase() + '.png';
const roleIcon = r => 'img/ui/role-' + String(r).toLowerCase() + '.webp';
const portrait = a => 'img/espers/' + a.slug + '.png';
const artOf = a => 'img/art/' + a.slug + '.png';

async function load() {
  const grab = (f, opt) => fetch(f).then(r => r.json()).catch(() => opt ? null : Promise.reject(new Error(f)));
  const [db, guide, dict, gear, i18n] = await Promise.all([
    grab('nte-db.json'), grab('nte-guide.json'), grab('nte-ru.json', 1),
    grab('nte-gear.json', 1), grab('nte-i18n.json', 1)
  ]);
  DB = db; GUIDE = guide; RU = dict; GEAR = gear; I18N = i18n;
  $('ver').textContent = APP_VER;
  drawTabs();
  draw();
}

function drawTabs() {
  $('tabs').innerHTML = TABS.map(t =>
    '<button class="tb' + (state.tab === t[0] ? ' on' : '') + '" data-t="' + t[0] + '">' +
    esc(t[1]) + '</button>').join('');
  $('tabs').querySelectorAll('.tb').forEach(b => b.onclick = () => {
    // фильтры сбрасываем: стихия, выбранная в списке эсперов, иначе сразу
    // прячет половину составов на соседней вкладке
    state.tab = b.dataset.t; state.q = ''; $('q').value = '';
    state.el = state.role = state.tier = state.rar = '';
    drawTabs(); draw();
  });
}

function draw() {
  const t = state.tab;
  $('q').style.display = (t === 'mech') ? 'none' : '';
  if (t === 'espers') return drawEspers();
  if (t === 'arcs')   return drawArcs();
  if (t === 'carts')  return drawCarts();
  if (t === 'tier')   return drawTier();
  if (t === 'ban')    return drawBanners();
  if (t === 'codes')  return drawCodes();
  if (t === 'mech')   return drawMech();
}

// ── фильтры ────────────────────────────────────────────────────────────────
function fgroup(label, key, list, icon, ru) {
  return '<div class="fgrp"><u>' + label + '</u>' +
    list.map(v => '<button class="fb' + (state[key] === v ? ' on' : '') +
      '" data-f="' + key + '" data-v="' + esc(v) + '">' +
      (icon ? '<img src="' + icon(v) + '" alt="" loading="lazy">' : '') +
      esc(ru ? (ru[v] || v) : v) + '</button>').join('') + '</div>';
}
function bindFilters() {
  $('filters').querySelectorAll('.fb').forEach(b => b.onclick = () => {
    const k = b.dataset.f;
    state[k] = (state[k] === b.dataset.v) ? '' : b.dataset.v;   // повторный клик снимает
    draw();
  });
}

// ── эсперы ─────────────────────────────────────────────────────────────────
function espersShown() {
  const q = state.q.trim().toLowerCase();
  return DB.agents.filter(a => {
    if (state.el && a.el !== state.el) return false;
    if (state.role && a.role !== state.role) return false;
    if (state.tier && a.tier !== state.tier) return false;
    if (q && (a.ru + ' ' + a.en + ' ' + a.slug).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort((x, y) => {
    const t = a => { const i = TIERS.indexOf(a.tier); return i < 0 ? 99 : i; };
    return (t(x) - t(y)) || x.ru.localeCompare(y.ru, 'ru');
  });
}
function drawEspers() {
  const els = [...new Set(DB.agents.map(a => a.el).filter(Boolean))].sort();
  const roles = [...new Set(DB.agents.map(a => a.role).filter(Boolean))];
  const tiers = TIERS.filter(t => DB.agents.some(a => a.tier === t));
  const list = espersShown();
  $('filters').innerHTML =
    fgroup('стихия', 'el', els, elIcon, EL_RU) +
    fgroup('роль', 'role', roles, roleIcon, ROLE_RU) +
    fgroup('тир', 'tier', tiers, null, null) +
    '<span class="fcnt">' + list.length + ' из ' + DB.agents.length + '</span>';
  bindFilters();
  $('body').innerHTML = list.length ? '<div class="grid">' + list.map(a =>
    '<div class="card" data-slug="' + a.slug + '" style="--el:var(--' + esc(a.el) + ')">' +
      '<div class="card-p">' +
        '<img src="' + portrait(a) + '" alt="' + esc(a.ru) + '" loading="lazy">' +
        (a.tier ? '<span class="card-t">' + esc(a.tier) + '</span>' : '') +
        '<span class="card-e">' +
          (a.el ? '<img src="' + elIcon(a.el) + '" title="' + esc(EL_RU[a.el] || a.el) + '" alt="">' : '') +
          (a.role ? '<img src="' + roleIcon(a.role) + '" title="' + esc(ROLE_RU[a.role] || a.role) + '" alt="">' : '') +
        '</span>' +
        '<div class="card-n"><b>' + esc(a.ru) + '</b><i>' + esc(a.en) + '</i></div>' +
      '</div></div>').join('') + '</div>'
    : '<div class="empty">Никого не нашлось — сними фильтры или почисти поиск.</div>';
  $('body').querySelectorAll('.card').forEach(c => c.onclick = () => open(c.dataset.slug));
  foot('Имена — из локализации игры, картинки — с вики, сборки — prydwen.');
}

// ── оружие ─────────────────────────────────────────────────────────────────
// Порядок как в трекере ZZZ: сперва S, потом A и B, внутри редкости по имени.
// Раньше сортировка шла по редкости в алфавитном порядке, и наверху оказывались
// синие A и B, а самое нужное уезжало вниз.
const RAR_ORDER = { S: 0, A: 1, B: 2 };
function arcOwner(a) {
  const ids = a.own || [];
  for (const num of ids) {
    const who = DB.agents.filter(x => x.num === num)[0];
    if (who) return who;
  }
  return null;
}
// «Атака 286 (+109 за прорывы)» — берём последний уровень и последнюю стадию.
function arcMax(a) {
  const lv = (a.lv || [])[(a.lv || []).length - 1];
  const bt = (a.bt || [])[(a.bt || []).length - 1];
  const out = { lv: lv ? lv.lv : 0, atk: lv ? lv.atk : 0, sub: null, btAtk: 0 };
  for (const m of (bt ? bt.mods : [])) {

}

// ── картриджи ──────────────────────────────────────────────────────────────
// Иконка набора и требуемые формы деталей — из игровых таблиц. По названию в
// списке ориентироваться неудобно: в игре набор узнаётся по значку.
//
// SuitGeometryCondition — это какие формы деталей набор вообще принимает.
// Названия там внутренние («EquipmentGeometry_Hen2»), поэтому показываем не их,
// а саму фигуру: рисуем клетки по координатам из таблицы форм.
function shapeMini(name) {
  const flat = (GEAR.shapes || {})[name];
  if (!flat) return '';
  const cells = [];
  for (let i = 0; i + 1 < flat.length; i += 2) cells.push([flat[i], flat[i + 1]]);
  const ys = cells.map(c => c[0]), xs = cells.map(c => c[1]);
  const y0 = Math.min(...ys), x0 = Math.min(...xs);
  const h = Math.max(...ys) - y0 + 1, w = Math.max(...xs) - x0 + 1;
  let out = '<span class="mini" style="grid-template-columns:repeat(' + w + ',5px)">';
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++)
    out += '<i style="' + (cells.some(p => p[0] - y0 === r && p[1] - x0 === c) ? '' : 'opacity:0') + '"></i>';
  return out + '</span>';
}
function shapeType(name) {
  const flat = (GEAR.shapes || {})[name];
  if (!flat) return '';
  const n = flat.length / 2;
  return n === 2 ? 'II' : n === 3 ? 'III' : n === 4 ? 'IV' : '';
}

// ── Console: сетка эспера ──────────────────────────────────────────────────
// Живёт внутри карточки: сетка у каждого эспера своя, и в отрыве от персонажа
// планировщик не нужен. Маска — из игры: «-1» значит, что клетки нет вовсе.
// Детали кладём по их настоящим формам, тоже из игры: полоски, уголки, зигзаги.
// Поворот — обычный поворот координат на 90 градусов.
let plan = { cells: {}, pick: null, rot: 0, next: 1, slug: '' };

function gridOf(slug) {
  if (!GEAR || !GEAR.grids) return null;
  const key = 'EquipmentSlots_' + (GRID_OF[slug] || '');
  return GEAR.grids[key] || null;
}
function shapeCells(flat) {
  const out = [];
  for (let i = 0; i + 1 < flat.length; i += 2) out.push([flat[i], flat[i + 1]]);
  return out;
}
function rotate(cells, times) {
  let c = cells.map(p => [p[0], p[1]]);
  for (let i = 0; i < (times % 4 + 4) % 4; i++) c = c.map(p => [p[1], -p[0]]);
  return c;
}
function shapeSize(name) { return shapeCells(GEAR.shapes[name]).length; }
function typeOf(name) {
  const n = shapeSize(name);
  return n === 2 ? 'II' : n === 3 ? 'III' : n === 4 ? 'IV' : '?';
}
// Форму называем по её виду, а не по внутреннему имени из таблицы: «Hen3» и
// «ZhiJiao4» ничего не говорят, а «полоска» и «уголок» говорят.
function shapeName(name) {
  const c = shapeCells(GEAR.shapes[name]);
  const ys = new Set(c.map(p => p[0])), xs = new Set(c.map(p => p[1]));
  if (ys.size === 1) return 'полоска ' + c.length;
  if (xs.size === 1) return 'столбик ' + c.length;
  if (c.length === 4 && ys.size === 2 && xs.size === 2) return 'квадрат';
  if (c.length === 3) return 'уголок';
  return ys.size === 2 || xs.size === 2 ? 'уголок ' + c.length : 'зигзаг ' + c.length;
}

const PIECE_COLORS = { II:'#60a5fa', III:'#4ade80', IV:'#fbbf24' };
function planMask(slug) {
  const g = gridOf(slug);
  return g ? g.mask.map(line => line.split(',').map(x => parseInt(x, 10))) : null;
}
// Набор картриджей эспера из игровых таблиц — нужен и ради значка, и ради
// списка форм, которые он принимает.
function suitOf(name) {
  if (!GEAR || !name) return null;
  const n = String(name).toLowerCase();
  return GEAR.suits.filter(x => String(x.en || '').toLowerCase() === n ||
                                String(x.ru || '').toLowerCase() === n)[0] || null;
}

// ── авторасклад ────────────────────────────────────────────────────────────
// Гайд говорит, какие типы деталей нужны («II, III, III, IV»), а набор — какие
// формы он вообще принимает. Раскладываем это по сетке сами: перебор с
// откатом, крупные детали первыми — так они находят место, пока оно есть.
// Раньше детали нужно было выкладывать руками, хотя раскладка ровно одна и
// известна заранее.
function autoLayout(slug, variant) {
  const mask = planMask(slug);
  const g = (GUIDE.agents || {})[slug] || {};
  const want = (g.pieces || []).slice();
  if (!mask || !want.length || !GEAR || !GEAR.shapes) return null;

  const suit = suitOf(g.set && g.set.n);
  const allowed = (suit && suit.geo && suit.geo.length) ? suit.geo : Object.keys(GEAR.shapes);
  const byType = {};
  allowed.forEach(n => { const t = typeOf(n); (byType[t] = byType[t] || []).push(n); });

  const H = mask.length, W = mask[0].length;
  const order = want.map((t, i) => ({ t: t, i: i }))
    .sort((a, b) => ({ IV:0, III:1, II:2 }[a.t] || 9) - ({ IV:0, III:1, II:2 }[b.t] || 9));
  const occ = {}, out = [];
  const shift = (variant || 0);

  function tryPut(cells, r, c) {
    const keys = [];
    for (const p of cells) {
      const rr = r + p[0], cc = c + p[1];
      if (rr < 0 || cc < 0 || rr >= H || cc >= W) return null;
      if (mask[rr][cc] < 0 || occ[rr + ':' + cc]) return null;
      keys.push(rr + ':' + cc);
    }
    return keys;
  }
  function step(k) {
    if (k >= order.length) return true;
    const need = order[k];
    const forms = (byType[need.t] || []);
    for (let f = 0; f < forms.length; f++) {
      const name = forms[(f + shift) % forms.length];
      for (let rot = 0; rot < 4; rot++) {
        const cells = rotate(shapeCells(GEAR.shapes[name]), rot);
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
          const keys = tryPut(cells, r, c);
          if (!keys) continue;
          keys.forEach(x => { occ[x] = need.i + 1; });
          out.push({ idx: need.i, t: need.t, name: name, keys: keys });
          if (step(k + 1)) return true;
          keys.forEach(x => { delete occ[x]; });
          out.pop();
        }
      }
    }
    return false;
  }
  if (!step(0)) return null;
  return out.sort((a, b) => a.idx - b.idx);
}

function planHtml(slug) {
  const mask = planMask(slug);
  if (!mask) return '<div class="hint">Сетка этого эспера ещё не попала в игровые таблицы.</div>';
  const a = agentBy(slug) || {};
  const g = (GUIDE.agents || {})[slug] || {};
  const suit = suitOf(g.set && g.set.n);
  const W = mask[0].length;
  const free = mask.reduce((n, r) => n + r.filter(v => v === 0).length, 0);

  const lay = autoLayout(slug, plan.variant) || [];
  const cellOf = {};
  lay.forEach(pc => pc.keys.forEach(k => { cellOf[k] = pc; }));
  const used = Object.keys(cellOf).length;

  // мини-картинки уложенных деталей — как «required pieces» на prydwen
  const legend = lay.map(pc => {
    const cells = shapeCells(GEAR.shapes[pc.name]);
    const ys = cells.map(c => c[0]), xs = cells.map(c => c[1]);
    const y0 = Math.min(...ys), x0 = Math.min(...xs);
    const h = Math.max(...ys) - y0 + 1, w = Math.max(...xs) - x0 + 1;
    let mini = '<span class="shp" style="grid-template-columns:repeat(' + w + ',7px)">';
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const has = cells.some(pt => pt[0] - y0 === r && pt[1] - x0 === c);
      mini += '<i style="' + (has ? 'background:' + (PIECE_COLORS[pc.t] || '#8b92a3') : 'opacity:0') + '"></i>';
    }
    return '<div class="pcs">' + mini + '</span><b>' + esc(pc.t) + '</b>' +
      '<i>' + esc(shapeName(pc.name)) + '</i></div>';
  }).join('');

  const board = '<div class="board" style="grid-template-columns:repeat(' + W + ',auto)">' +
    mask.map((row, r) => row.map((v, c) => {
      const k = r + ':' + c;
      const pc = cellOf[k];
      const st = v < 0 ? ' off' : (pc ? ' on' : '');
      const bg = pc ? ' style="background:' + (PIECE_COLORS[pc.t] || '#8b92a3') + '"' : '';
      return '<div class="cell' + st + '"' + bg + '>' + (pc ? '<b>' + esc(pc.t) + '</b>' : '') + '</div>';
    }).join('')).join('') + '</div>';

  return '<div class="plan">' +
      '<div class="plan-l">' + board +
        '<div class="hint">Сетка типа ' + (a.grid || '?') + ', занято ' + used + ' из ' + free +
          ' клеток. Так детали из гайда как раз помещаются.</div>' +
      '</div>' +
      '<div class="plan-r">' +
        (suit || (g.set && g.set.n) ?
          '<div class="cap" style="margin-top:4px"><b>Набор модулей</b><span></span></div>' +
          '<div class="cart" style="margin-bottom:10px">' +
            (suit && suit.icon ? '<img class="cart-ic" src="img/suits/' + esc(suit.icon) + '" alt="">' : '') +
            '<div class="item-b">' +
              '<b style="font-size:14px;color:var(--gold)">' + esc(ruName('carts', g.set.n)) + '</b>' +
              (g.set.b2 ? '<div class="set-b"><i>2</i>' + esc(tr(g.set.b2)) + '</div>' : '') +
              (g.set.b4 ? '<div class="set-b"><i>4</i>' + esc(tr(g.set.b4)) + '</div>' : '') +
              (g.trait ? '<div class="trait"><i>бонус эспера за модули</i>' + esc(tr(g.trait)) + '</div>' : '') +
            '</div>' +
          '</div>' : '') +
        (lay.length ? '<div class="cap"><b>Нужные детали</b><span></span><em>из гайда</em></div>' +
          '<div class="pieces-row">' + legend + '</div>' : '') +
        (g.pieces && g.pieces.length && !lay.length ?
          '<div class="hint">Гайд советует детали ' + g.pieces.join(', ') +
          ', но уложить их на эту сетку не вышло — возможно, набор принимает другие формы.</div>' : '') +
        '<button class="fb" id="planNext" style="margin-top:12px">другой вариант раскладки</button>' +
      '</div>' +
    '</div>';
}
function bindPlan() {
  const b = $('planNext');
  if (b) b.onclick = () => {
    plan.variant = (plan.variant || 0) + 1;
    const box = $('shBody');
    if (box) { box.innerHTML = planHtml(plan.slug); bindPlan(); }
  };
}

// ── баннеры ────────────────────────────────────────────────────────────────
// Расписание берётся с prydwen: своей таблицы под баннеры в игре нет. Карточки
// приходят уже сгруппированными — «идут сейчас», «следующие», «объявленные», —
// поэтому просто выводим их подборками в том же порядке.
function drawBanners() {
  const list = (GUIDE.banners || []).filter(b => {
    const q = state.q.trim().toLowerCase();
    return !q || (b.name + ' ' + b.patch).toLowerCase().indexOf(q) >= 0;
  });
  $('filters').innerHTML = '<span class="fcnt">' + list.length + ' баннеров</span>';
  if (!list.length) {
    $('body').innerHTML = '<div class="empty">Расписания пока нет — оно приезжает вместе ' +
      'со сборками, прогони nte-pryd.js версии 1.3 или новее.</div>';
    foot('');
    return;
  }
  const groups = [];
  list.forEach(b => {
    let g = groups.filter(x => x.name === b.group)[0];
    if (!g) { g = { name: b.group, items: [] }; groups.push(g); }
    g.items.push(b);
  });
  // «идёт сейчас» — если в подборке так и написано; красим зелёным

// Даты приходят в ISO («2026-08-19») — показываем по-нашему, днём и месяцем.
// Если баннер идёт прямо сейчас, дописываем, сколько ему осталось.
function banDates(b) {
  const d = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? m[3] + '.' + m[2] : ''; };
  const from = d(b.from), to = d(b.to);
  if (!from) return b.dates || '';
  let out = from + (to ? ' — ' + to : '');
  const end = Date.parse(b.to), now = Date.now();
  if (end && end > now) {
    const days = Math.ceil((end - now) / 86400000);
    if (days <= 60) out += ', осталось ' + days + ' ' + plural(days, 'день', 'дня', 'дней');
  }
  return out;
}
function plural(n, a, b2, c) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b2;
  return c;
}

// ── калькулятор отдачи статов ──────────────────────────────────────────────
// Смысл: у любого стата отдача падает по мере роста — 10-й процент крит-шанса
// стоит дороже первого. Считаем не «сколько стата», а сколько урона добавит
// ОДИН реальный сабстат S-редкости. Как только один стат начинает давать
// меньше другого — качать его дальше невыгодно.
//
// Урон = ATK × (1 + CR×CD) × (1 + сумма процентов урона).
// Прирост от добавки Δ считается как производная этого произведения:
//   ATK%  → Δ × базовая_атака / итоговая_атака
//   CR    → Δ × CD / (1 + CR×CD)
//   CD    → Δ × CR / (1 + CR×CD)
//   DMG%  → Δ / (1 + сумма процентов)
// Отсюда и «каппа»: крит-шанс и крит-урон уравниваются, когда CD = 2×CR,
// потому что сабстат даёт 10% шанса против 20% урона. Дальше выгоднее второе.
const SUB_S = { cr:10, cd:20, atkp:12.5, dmg:10, atk:80 };   // сабстат S-картриджа
const calc = { atk:2000, base:1000, cr:65, cd:160, dmg:80 };

function calcRows() {
  const cr = Math.min(100, Math.max(0, calc.cr)) / 100;
  const cd = Math.max(0, calc.cd) / 100;
  const dmg = Math.max(0, calc.dmg) / 100;
  const atk = Math.max(1, calc.atk), base = Math.max(1, calc.base);
  const critM = 1 + cr * cd;
  const room = Math.max(0, 1 - cr);                       // сколько крит-шанса ещё влезет
  const rows = [
    { k:'cr',   n:'Шанс крита',  add:'+' + SUB_S.cr + '%',
      g: Math.min(SUB_S.cr / 100, room) * cd / critM },
    { k:'cd',   n:'Крит. урон',  add:'+' + SUB_S.cd + '%',
      g: (SUB_S.cd / 100) * cr / critM },
    { k:'atkp', n:'Атака %',     add:'+' + SUB_S.atkp + '%',
      g: (SUB_S.atkp / 100) * base / atk },
    { k:'dmg',  n:'Урон %',      add:'+' + SUB_S.dmg + '%',
      g: (SUB_S.dmg / 100) / (1 + dmg) },
    { k:'atk',  n:'Атака плоская', add:'+' + SUB_S.atk,
      g: SUB_S.atk / atk }
  ];
  return rows.sort((a, b) => b.g - a.g);
}
function calcVerdict() {
  const cr = calc.cr, cd = calc.cd;
  const want = Math.round(cr * 2);                        // равновесие: CD = 2 × CR
  if (cr >= 99) return 'Крит-шанс упёрся в потолок — <b>дальше только крит. урон</b>. ' +
    'Всё, что сверх 100%, пропадает впустую; если часть шанса даёт бафф от команды или сет, ' +
    'своих статов держи ровно столько, чтобы с баффом выходило 100.';
  if (cd < want - 12) return 'Крит. урон отстаёт: при шансе ' + cr + '% равновесие примерно на ' +
    '<b>' + want + '% крит. урона</b>. Сейчас ' + cd + '% — <b>качай крит. урон</b>.';
  if (cd > want + 40) return 'Крит. урон убежал вперёд: при ' + cd + '% крит. урона выгоднее ' +
    'добирать <b>шанс крита</b> — равновесие для него около <b>' + Math.round(cd / 2) + '%</b>.';
  return 'Крит сбалансирован: <b>' + cr + '% / ' + cd + '%</b> близко к правилу ' +
    '<b>крит. урон = 2 × шанс крита</b>. Дальше смотри на таблицу ниже — там видно, ' +
    'какой стат сейчас даёт больше.';
}
// Считаем для конкретного эспера: поля сразу заполняются его целями из гайда,
// а вопрос «что качать дальше» имеет смысл только применительно к нему.
// Считаем для конкретного эспера. Числа берём из того, что вписано во вкладке
// «Сейчас»; если там пусто — из целей гайда, и об этом честно пишем.
function calcFill(slug) {
  const my = myStats(slug);
  const G = ((GUIDE.agents || {})[slug] || {}).goals || {};
  const pick = (k, g) => (my[k] != null ? my[k] : (G[g] ? G[g][0] : null));
  calc.atk = pick('atk', 'atk') || 2000;
  calc.cr  = pick('cr', 'cr')   || 50;
  calc.cd  = pick('cd', 'cd')   || 100;
  const dmg = my.dmg != null ? my.dmg : ((G.dmg ? G.dmg[0] : 0) + (G.elem ? G.elem[0] : 0));
  calc.dmg = dmg || 0;
  // Базовая атака — та, от которой считаются проценты: сам эспер плюс оружие,
  // без плоской прибавки с модулей. В игре её отдельно не показывают, поэтому
  // берём половину итоговой: у собранного персонажа это близко к правде и
  // спрашивать лишнее число не приходится.
  calc.base = Math.max(500, Math.round(calc.atk * 0.5));
  calc.fromMe = my.atk != null || my.cr != null || my.cd != null;
}
function calcTable() {
  const rows = calcRows(), top = rows[0].g;
  return '<tr><th>стат</th><th>один сабстат S</th><th>даст урона</th><th>отдача</th></tr>' +
    rows.map((r, i) =>
      '<tr' + (i === 0 ? ' class="top"' : '') + '><td><b>' + esc(r.n) + '</b></td><td>' +
      esc(r.add) + '</td><td class="num">+' + (r.g * 100).toFixed(2) + '%</td>' +
      '<td><div class="bar"><i style="width:' + Math.max(2, Math.round(r.g / (top || 1) * 100)) +
      '%"></i></div></td></tr>').join('');
}
function calcHtml() {
  const F = ['atk','cr','cd','dmg'];
  const LBL = { atk:'Атака', cr:'Шанс крита, %', cd:'Крит. урон, %',
                dmg:'Сумма процентов урона, %' };
  return '<div class="hint" style="margin:0 0 8px">' +
      (calc.fromMe ? 'Числа взяты из твоих характеристик выше.'
                   : 'Числа взяты из целей гайда — впиши свои выше, и расчёт пойдёт по ним.') +
    '</div>' +
    '<div class="inp">' + F.map(k =>
      '<div><label>' + esc(LBL[k]) + '</label>' +
      '<input type="number" step="any" data-k="' + k + '" value="' + calc[k] + '"></div>').join('') +
    '</div>' +
    '<div class="verdict">' + calcVerdict() + '</div>' +
    '<table class="tbl">' + calcTable() + '</table>' +
    '<div class="hint">Показано, сколько процентов урона добавит <b>один</b> дополнительный ' +
    'стат S-картриджа. Верхняя строка — то, что выгоднее всего добирать сейчас. ' +
    'Правило: <b>крит. урон = 2 × шанс крита</b> (сабстат даёт 10% шанса или 20% урона), ' +
    'шанс крита выше 100% пропадает, а проценты урона складываются в один множитель — ' +
    'чем их больше, тем дешевле стоит следующий.</div>';
}
function bindCalc() {
  const box = $('calcBox');
  if (!box) return;
  box.querySelectorAll('input[data-k]').forEach(inp => inp.oninput = () => {
    const v = parseFloat(inp.value);
    calc[inp.dataset.k] = isFinite(v) ? v : 0;
    // обновляем только выводы, чтобы не терять фокус в поле
    const vd = box.querySelector('.verdict'), tbl = box.querySelector('.tbl');
    if (vd) vd.innerHTML = calcVerdict();
    if (tbl) tbl.innerHTML = calcTable();
  });
}

// ── мои характеристики ─────────────────────────────────────────────────────
// Переносить их из игры автоматически нечем: у NTE нет ни витрины профиля, ни
// открытого API — эти цифры видны только на экране персонажа. Поэтому вписываем
// руками один раз, а браузер их запоминает: дальше карточка сама показывает,
// чего не хватает до целей гайда, и калькулятор считает по твоим числам.
const MY_KEYS = [
  ['hp',  'ОЗ',                 'hp',   0],
  ['atk', 'Атака',              'atk',  0],
  ['def', 'Защита',             'def',  0],
  ['cr',  'Шанс крита, %',      'cr',   1],
  ['cd',  'Крит. урон, %',      'cd',   1],
  ['dmg', 'Урон стихии, %',     'elem', 1],
  ['cyc', 'Инт. цикла',         'cyc',  0],
  ['brk', 'Инт. разрушения',    'brk',  0]
];
function myStats(slug) {
  try { return JSON.parse(localStorage.getItem('nte-my-' + slug)) || {}; }
  catch (e) { return {}; }
}
function myStatsSave(slug, obj) {
  try { localStorage.setItem('nte-my-' + slug, JSON.stringify(obj)); } catch (e) {}
}
// Скриншот уходит на воркер, тот читает числа моделью зрения и возвращает их.
// Перед отправкой ужимаем до 1400px и в jpeg: экран 2K весит мегабайты, а для
// распознавания хватает и этого.
const API_BASES = ['', 'https://api.alextask.ru', 'https://alextask.ru',
                   'https://alextask-push.12dogswog76.workers.dev']
  .filter((b, i) => i === 0 || b.indexOf('//' + location.host) < 0);
const OCR_API = API_BASES.map(b => b + '/api/nte/ocr');

// Лучшая модель распознавания закрыта лицензией Meta: её принимают одним
// запросом «agree», и в дашборде Cloudflare такой кнопки нет. Воркеру доступ к
// AI уже выдан, поэтому согласие отправляет он — по нажатию здесь.
async function aiAgree(say) {
  say('отправляю согласие с лицензией…');
  for (const b of API_BASES) {
    try {
      const r = await fetch(b + '/api/nte/agree', { method: 'POST' });
      const j = await r.json();
      if (j && j.ok) { say('лицензия принята — распознавание теперь идёт лучшей моделью'); return; }
      if (j && j.error) { say('не вышло: ' + j.error, 1); return; }
    } catch (e) {}
  }
  say('воркер не ответил — залит ли alextask-worker.js версии 27?', 1);
}

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b ? res(b) : rej(new Error('не сжалось')), 'image/jpeg', 0.85);
    };
    img.onerror = () => rej(new Error('это не картинка'));
    img.src = URL.createObjectURL(file);
  });
}
async function ocrShot(file, slug, say) {
  say('сжимаю картинку…');
  let blob;
  try { blob = await shrink(file); } catch (e) { say('не вышло: ' + e.message, 1); return; }
  say('распознаю, это занимает секунд десять…');
  let data = null, err = '';
  for (const u of OCR_API) {
    try {
      const r = await fetch(u, { method: 'POST', body: blob,
        headers: { 'Content-Type': 'application/octet-stream' } });
      const j = await r.json();
      if (j && j.stats) { data = j; break; }
      err = (j && j.error) || 'пустой ответ';
    } catch (e) { err = e.message; }
  }
  if (!data) {
    say('не вышло: ' + err, 1);
    // модель просит разовое согласие — предлагаем нажать кнопку прямо тут
    if (/agree|5016|лицензи/i.test(err)) {
      const el = $('ocrSay');
      if (el) {
        const b = document.createElement('button');
        b.className = 'fb';
        b.style.marginLeft = '8px';
        b.textContent = 'принять лицензию модели';
        b.onclick = () => aiAgree(say);
        el.after(b);
      }
    }
    return;
  }
  const got = data.stats || {};
  const n = Object.keys(got).length;
  if (!n) { say('на картинке не нашлось характеристик — попробуй скрин экрана персонажа целиком', 1); return; }
  const my = myStats(slug);
  Object.keys(got).forEach(k => { my[k] = got[k]; });
  myStatsSave(slug, my);
  say('распознано значений: ' + n + ' — проверь числа глазами');
  calcFill(slug);
  const g = (GUIDE.agents || {})[slug] || {};
  $('shBody').innerHTML = nowHtml(slug, g, agentBy(slug), (t, note) =>
    '<div class="cap"><b>' + esc(t) + '</b><span></span>' +
    (note ? '<em>' + esc(note) + '</em>' : '') + '</div>');
  bindShBody();
}

function myHtml(slug, g) {

// «Сейчас» — что с эспером сегодня: баннер, место в мете, твои характеристики

function nowHtml(slug, g, a, cap) {
  const bans = (GUIDE.banners || []).filter(b => b.slug === slug);
  const live = bans.filter(b => /current|сейчас/i.test(b.key + ' ' + b.group))[0];

  const asCore = inTeams.filter(t => (t.slots[0] || []).indexOf(slug) >= 0).length;
  const rat = g.ratings || {};

  const tiles = '<div class="stat">' +
      (a.tier ? '<div class="st"><b>' + esc(a.tier) + '</b>место в тир-листе</div>' : '') +
      (rat.awk ? '<div class="st"><b>' + esc(rat.awk) + '</b>оценка при пробуждениях</div>' : '') +
      '<div class="st' + (inTeams.length ? ' ok' : '') + '"><b>' + inTeams.length + '</b>мета-составов</div>' +
      (asCore ? '<div class="st"><b>' + asCore + '</b>из них он ядро</div>' : '') +
    '</div>';
  const banner = live
    ? '<div class="verdict">Баннер <b>идёт прямо сейчас</b>: ' + esc(banDates(live)) +
      (live.patch ? ' · ' + esc(live.patch) : '') + '</div>'
    : next
      ? '<div class="box"><b>Ближайший баннер</b>' + esc(next.group) + ': ' + esc(banDates(next)) +
        (next.patch ? ' · ' + esc(next.patch) : '') + '</div>'
      : '<div class="hint">Баннера в расписании нет — либо он уже прошёл, либо ещё не объявлен.</div>';
  const cal = (g.goals && (g.goals.cr || g.goals.cd))
    ? cap('Что качать дальше', 'отдача одного сабстата') + '<div id="calcBox">' + calcHtml() + '</div>'
    : '';
  return tiles + banner +
    (rat.mode ? '<div class="hint">Оценка prydwen: ' + esc(RATE_RU[rat.role] || rat.role || '') +
      ', режим ' + esc(RATE_RU[rat.mode] || rat.mode) + '.</div>' : '') +
    cap('Мои характеристики', 'из игры, вручную') + myHtml(slug, g) +
    cal;
}
function bindMy(slug) {
  const box = $('shBody');
  if (!box) return;
  const say = (t, bad) => {
    const el = $('ocrSay');
    if (el) { el.textContent = t; el.style.color = bad ? '#fbbf24' : 'var(--acc)'; }
  };
  if ($('ocrPick')) {
    $('ocrPick').onclick = () => $('ocrFile').click();
    $('ocrFile').onchange = e => { const f = e.target.files[0]; if (f) ocrShot(f, slug, say); };
    // вставка скрина из буфера — самый быстрый путь: Win+Shift+S и сразу Ctrl+V
    box.onpaste = e => {
      const it = [...(e.clipboardData ? e.clipboardData.items : [])]
        .filter(x => x.type && x.type.indexOf('image') === 0)[0];
      if (!it) return;
      e.preventDefault();
      ocrShot(it.getAsFile(), slug, say);
    };
  }
  box.querySelectorAll('input[data-my]').forEach(inp => inp.onchange = () => {
    const my = myStats(slug);
    const v = parseFloat(inp.value);
    if (isFinite(v)) my[inp.dataset.my] = v; else delete my[inp.dataset.my];
    myStatsSave(slug, my);
    calcFill(slug);
    const g = (GUIDE.agents || {})[slug] || {};
    const a = agentBy(slug);
    box.innerHTML = nowHtml(slug, g, a, (t, note) =>
      '<div class="cap"><b>' + esc(t) + '</b><span></span>' +
      (note ? '<em>' + esc(note) + '</em>' : '') + '</div>');
    bindShBody();
  });
}

// Составы, где этот эспер есть: со своей страницы гайда (там они расписаны
// под него) плюс из общего тир-листа команд.
//
// Тир есть только у вторых, поэтому раньше половина составов висела без ранга,
// а «Zankou Hyper» показывался дважды — один раз со страницы эспера, другой из
// тир-листа, потому что слоты у них слегка разные. Сводим их по названию:
// совпало — берём слоты с гайда, а ранг из тир-листа.
const teamKey = t => String(t.name || '').toLowerCase().replace(/[^a-zа-я0-9]+/gi, '');
function teamsFor(slug, cap) {
  const own = ((GUIDE.agents || {})[slug] || {}).teams || [];
  const glob = (GUIDE.teams || []).filter(t => t.slots.some(s => s.indexOf(slug) >= 0));
  const byName = {};
  glob.forEach(t => { byName[teamKey(t)] = t; });

  const out = [], seen = new Set();
  const push = t => {
    if (t.slots.length < 3) return;
    const k = teamKey(t) || t.slots.map(s => s.slice().sort().join('/')).join('|');
    if (seen.has(k)) return;
    seen.add(k);
    out.push(t);
  };
  own.forEach(t => {
    const g = byName[teamKey(t)];
    push(Object.assign({}, t, { tier: (g && g.tier) || '', note: g ? '' : 'состав из гайда' }));
  });
  glob.forEach(t => push(Object.assign({}, t, { note: '' })));
  if (!out.length) return '';
  out.sort((x, y) => {
    const r = t => { const i = TIERS.indexOf(t.tier); return i < 0 ? 99 : i; };
    return r(x) - r(y);
  });
  return cap('Составы с ним', out.length + ' шт.') + teamsHtml(out, true);
}

// «С кем играется»: по блоку на союзника, каждый разворачивается. Раскрытым
// весь список занимал полтора экрана — при девяти-одиннадцати союзниках это
// нечитаемо.
function synergyFor(g, cap) {
  const syn = g.synergy || [];
  if (!syn.length) return '';
  return cap('С кем играется', syn.length + ' союзников') + syn.map(s => {
    const names = s.with.map(w => { const x = agentBy(w); return x ? x.ru : w; }).join(' / ');
    const pics = s.with.map(w => {
      const x = agentBy(w);
      return '<img src="' + (x ? portrait(x) : '') + '" alt="" loading="lazy">';
    }).join('');
    return '<details class="fold"><summary>' + pics +
        '<b>' + esc(names) + '</b>' +
        '<span class="hint" style="margin:0 0 0 auto">' + s.notes.length + '</span>' +
      '</summary>' +
      '<div class="fold-in"><ul style="margin:0;padding-left:18px;color:var(--tx2);' +
        'font-size:12px;line-height:1.6">' +
        s.notes.map(n => '<li>' + esc(tr(n)) + '</li>').join('') +
      '</ul></div></details>';
  }).join('');
}

function close() {
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
}
function foot(t) {
  $('foot').innerHTML = esc(t) + ' Источники: ' +
    '<a href="https://www.prydwen.gg/neverness-to-everness/" target="_blank" rel="noopener">prydwen.gg</a>, ' +
    '<a href="https://neverness-to-everness.fandom.com/" target="_blank" rel="noopener">вики NTE</a>.';
}
$('sheet').onclick = e => { if (e.target === $('sheet')) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
$('q').oninput = () => { state.q = $('q').value; draw(); };

load().catch(e => {
  $('body').innerHTML = '<div class="empty">Не удалось загрузить данные: ' + esc(e.message) +
    '<br>Проверь, что рядом лежат nte-db.json и nte-guide.json.</div>';
});
