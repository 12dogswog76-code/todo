<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Endfield — справочник</title>
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Скрипт отдельным файлом, поэтому inline-обработчиков нет нигде.
     Картинки: значки предметов с enka, арты операторов с prydwen.
     Витрина профиля идёт через наш воркер на workers.dev. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://enka.network https://cdn.prydwen.gg; connect-src 'self' https://alextask-push.12dogswog76.workers.dev; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<style>
:root{
  --bg:#0e0f11; --pan:#17181c; --pan2:#1e2026; --ln:#2a2d35;
  --tx:#edeef2; --tx2:#8d919c; --tx3:#585c67;
  --acc:#4ade80; --gold:#ffd046; --warn:#fbbf24; --bad:#f87171;
  --disp:Oswald,"Arial Narrow",Impact,sans-serif;
  --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --glass:inset 0 0 40px rgba(255,255,255,.02);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--body);
     -webkit-text-size-adjust:100%}
.wrap{max-width:1760px;margin:0 auto;padding:0 14px 60px}

/* ── шапка ─────────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:rgba(14,15,17,.93);
     backdrop-filter:blur(9px);border-bottom:1px solid var(--ln);margin:0 -14px 12px;
     padding:8px 14px}
.top-in{max-width:1760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:600 19px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;
      color:var(--gold);background:none;border:0;cursor:pointer;padding:2px 0}
.logo span{color:var(--tx2)}
.ver{font:10px/1 var(--mono);color:var(--tx3);background:var(--pan);border:1px solid var(--ln);
     border-radius:9px;padding:4px 7px;cursor:pointer;white-space:nowrap}
.ver b{color:var(--tx2);font-weight:400}
.sync{font:11px/1 var(--body);color:var(--tx2);background:var(--pan);border:1px solid var(--ln);
      border-radius:9px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sync:hover{border-color:#3a3e49;color:var(--tx)}
.sync.ok{color:var(--acc);border-color:rgba(74,222,128,.45)}
.sync.err{color:var(--bad);border-color:rgba(248,113,113,.45)}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.tab{font:11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);
     background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;
     cursor:pointer;transition:.16s}
.tab:hover{border-color:#3a3e49;color:var(--tx);transform:translateY(-1px)}
.tab.on{color:#0e0f11;background:var(--gold);border-color:var(--gold);font-weight:600}

/* ── фильтры ───────────────────────────────────────────────────────────── */
.fbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.fgrp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fgrp>i{font:9px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
        color:var(--tx3);font-style:normal;margin-right:2px}
.fb{font:11px/1 var(--body);color:var(--tx2);background:var(--pan);border:1px solid var(--ln);
    border-radius:9px;padding:7px 10px;cursor:pointer;transition:.16s}
.fb:hover{border-color:#3a3e49;color:var(--tx)}
.fb.on{color:var(--acc);border-color:rgba(74,222,128,.55);
       box-shadow:0 0 0 1px rgba(74,222,128,.18),0 0 16px rgba(74,222,128,.10)}
.fcnt{font:9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);
      margin-left:auto}
.srch{font:12px var(--body);color:var(--tx);background:var(--pan);border:1px solid var(--ln);
      border-radius:9px;padding:7px 10px;min-width:150px;outline:none}
.srch:focus{border-color:#3a3e49}

/* ── общее ─────────────────────────────────────────────────────────────── */
.cap{display:flex;align-items:center;gap:9px;margin:16px 0 9px;
     font:600 12px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--tx)}
.cap::before{content:"";width:3px;height:19px;border-radius:2px;background:var(--gold)}
.cap i{flex:1;height:1px;background:var(--ln)}
.cap em{font:italic 9px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.box{background:var(--pan);border:1px solid var(--ln);border-radius:13px;padding:11px 12px;
     box-shadow:var(--glass)}
.box>b{display:block;color:var(--gold);font:600 11px/1 var(--body);letter-spacing:.05em;
       text-transform:uppercase;margin-bottom:7px}
.hint{color:var(--tx3);font-size:11px;margin:14px 0 0}
.empty{text-align:center;color:var(--tx3);font:11px/1 var(--body);letter-spacing:.2em;
       text-transform:uppercase;padding:40px 0}
.num{font-family:var(--mono);color:var(--gold)}
.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}

/* ── плитки операторов: главная витрина ────────────────────────────────── */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:11px;
     align-items:start}
.tile{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;cursor:pointer;
      background:var(--pan);border:1px solid var(--ln);box-shadow:var(--glass);
      transition:.17s;padding:0;display:block;width:100%;text-align:left}
.tile:hover{transform:translateY(-2px);border-color:var(--el,#3a3e49)}
.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.tile .sh{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,15,17,0) 34%,rgba(14,15,17,.72) 66%,rgba(14,15,17,.96) 100%)}
.tile .el{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--el,#555)}
.tile .info{position:absolute;left:9px;right:9px;bottom:10px}
.tile .nm{font:600 14px/1.1 var(--body);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.tile .sub{font:10px/1.3 var(--body);color:#c6cad3;margin-top:3px;
           text-shadow:0 1px 6px rgba(0,0,0,.7)}
.tile .rk{position:absolute;top:8px;left:9px;font:600 11px/1 var(--mono);color:var(--gold);
          background:rgba(14,15,17,.72);border:1px solid rgba(255,208,70,.35);border-radius:7px;
          padding:4px 6px}
.tile .lv{position:absolute;top:8px;right:9px;font:600 11px/1 var(--mono);color:#0e0f11;
          background:var(--acc);border-radius:7px;padding:4px 6px}
.tile .lv.no{background:var(--pan2);color:var(--tx3);border:1px solid var(--ln)}
.tile .pot{position:absolute;top:32px;right:9px;font:10px/1 var(--mono);color:var(--gold);
           background:rgba(14,15,17,.72);border:1px solid var(--ln);border-radius:7px;padding:3px 5px}

/* ── панель поверх страницы: карточка оператора ────────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,7,9,.74);backdrop-filter:blur(3px);
       display:none;padding:22px 14px;overflow:auto}
.sheet.on{display:block}
.sheet-in{max-width:1180px;margin:0 auto;background:var(--pan);border:1px solid var(--ln);
          border-radius:18px;padding:16px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.x{float:right;background:var(--pan2);border:1px solid var(--ln);border-radius:9px;
   color:var(--tx2);cursor:pointer;padding:5px 10px;font:12px var(--body)}
.card{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.art{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--ln);
     background:var(--pan2);aspect-ratio:1/1}
.art img{width:100%;height:100%;object-fit:cover}
.art .el{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--el,#555)}
.card-in{display:grid;gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
         align-items:start}
.sec{padding:0 0 12px}
.sec.full{grid-column:1/-1}
.sec>h4{margin:0 0 7px;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
        color:var(--tx3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.kv>span{color:var(--tx2)}
.kv>b{font-family:var(--mono);color:var(--gold);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font:9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
        color:var(--tx3);padding:5px 7px;border-bottom:1px solid var(--ln);font-weight:500}
.tbl td{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.04)}
.tbl td.n{text-align:right;font-family:var(--mono);color:var(--gold)}
.tbl tr.top td{background:rgba(255,208,70,.06)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;font:10px/1 var(--mono);
      border:1px solid var(--ln);border-radius:7px;padding:5px 7px;color:var(--tx2)}
.chip.el{color:var(--el,#888);border-color:var(--el,#333)}
.tname{font:600 22px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.tname em{display:block;font:italic 11px/1.4 var(--body);color:var(--tx3);margin-top:4px}

/* ── предметы ──────────────────────────────────────────────────────────── */
.it{display:flex;align-items:center;gap:9px;background:var(--pan2);border:1px solid var(--ln);
    border-radius:11px;padding:8px 10px;transition:.16s}
.it:hover{border-color:#3a3e49}
.it img{width:38px;height:38px;object-fit:contain;flex:none;background:var(--pan);
        border-radius:9px;padding:2px}
.it b{display:block;font:600 12px/1.2 var(--body)}
.it i{font:italic 10px/1.3 var(--body);color:var(--tx3)}
.r6{color:var(--gold)} .r5{color:#c89bff} .r4{color:#63b3ff}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:9px;
      align-items:start}
.list>details[open]{grid-column:1/-1}
details.op{background:var(--pan);border:1px solid var(--ln);border-left:3px solid var(--el,#555);
           border-radius:13px;overflow:hidden;box-shadow:var(--glass);transition:.16s}
details.op:hover{border-color:#3a3e49}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px}
summary::-webkit-details-marker{display:none}
.ava{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--pan2);
     border:1px solid var(--ln);flex:none}
.nm2{font:600 14px/1.15 var(--body)}
.nm2 i{display:block;font:italic 10px/1.3 var(--body);color:var(--tx3);margin-top:3px}
.rar{margin-left:auto;font:600 12px/1 var(--mono);color:var(--gold);flex:none}
.op-in{padding:0 11px 12px;border-top:1px solid var(--ln);margin-top:2px}

/* ── настройки синхронизации ───────────────────────────────────────────── */
.fld{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.fld input{flex:1;min-width:170px;font:13px var(--mono);color:var(--tx);background:var(--pan2);
           border:1px solid var(--ln);border-radius:9px;padding:9px 11px;outline:none}
.btn{font:12px var(--body);color:#0e0f11;background:var(--gold);border:0;border-radius:9px;
     padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sec2{background:var(--pan2);color:var(--tx2);border:1px solid var(--ln);font-weight:400}
.say{font-size:11px;color:var(--tx2);min-height:16px}
@media(max-width:820px){
  .card{grid-template-columns:1fr}
  .art{max-width:320px;margin:0 auto}
}
@media(max-width:700px){
  .wrap{padding:0 9px 50px} .top{margin:0 -9px 10px;padding:7px 9px}
  .ops{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .list{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <button class="logo" id="up">ENDFIELD<span>.справочник</span></button>
  <button class="ver" id="ver">v2 <b>· воркер …</b></button>
  <button class="sync" id="sync">профиль</button>
  <div class="tabs" id="tabs"></div>
</div></div>

<div class="wrap">
  <div class="fbar" id="fbar"></div>
  <div id="body"><div class="empty">загрузка базы…</div></div>
  <p class="hint" id="src"></p>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<script src="app.js"></script>
</body>
</html>
